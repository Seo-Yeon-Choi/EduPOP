spring.application.name=EduPOP
# DB 접속 URL
spring.datasource.url=jdbc:mysql://localhost:3306/edupop?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true

# DB 접근 계정 정보
spring.datasource.username=root
spring.datasource.password=


# MySQL 드라이버 클래스 지정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis : JDBC코드보다 간결하게 쿼리 실행, 자바코드와 sql문 분리
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.EduPOP.domain
mybatis.configuration.map-underscore-to-camel-case=true

# ===== 파일 업로드 =====
spring.servlet.multipart.enabled=true
# 파일 하나 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 요청 전체(글 내용 + 파일) 최대 크기
spring.servlet.multipart.max-request-size=12MB

# 업로드된 사진이 실제로 저장되는 폴더 (프로젝트 안 upload 폴더)
# * 경로에 역슬래시(\)를 쓰면 안 됨 - properties 파일에서 특수문자라 경로가 깨짐
# mysns.upload.dir=${user.dir}/upload/