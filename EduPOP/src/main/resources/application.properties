spring.application.name=EduPOP
# DB 접속 URL
spring.datasource.url=jdbc:mysql://localhost:3306/edupop?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true

# DB 접근 계정 정보
spring.datasource.username=root
spring.datasource.password=


# MySQL 드라이버 클래스 지정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis : JDBC코드보다 간결하게 쿼리 실행, 자바코드와 sql문 분리
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.EduPOP.domain
mybatis.configuration.map-underscore-to-camel-case=true

# ===== 파일 업로드 =====
spring.servlet.multipart.enabled=true
# 파일 하나 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 요청 전체(글 내용 + 파일) 최대 크기
spring.servlet.multipart.max-request-size=12MB

# 세션 만료 시간
server.servlet.session.timeout=30m

# JavaScript에서 JSESSIONID 접근 방지
server.servlet.session.cookie.http-only=true

# 외부 사이트에서 세션 쿠키 전송 제한
server.servlet.session.cookie.same-site=lax

# 카카오 로그인
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/kakao/callback}

# 네이버 로그인
# spring.config.import=optional:file:.env[.properties]

naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8080/naver/callback}

# 구글 로그인

google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/google/callback}

# 국세청 사업자 진위확인 API
nts.business-api-key=${NTS_BUSINESS_API_KEY:}