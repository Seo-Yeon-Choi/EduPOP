<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학원 관리</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 150px; font-weight: bold; }
        input[type="text"] { width: 300px; padding: 6px; }
        button { padding: 8px 15px; cursor: pointer; }
        .delete-btn { background-color: #ff4d4f; color: white; border: none; }
    </style>
</head>
<body>

<h2>🏫 학원 정보 관리 페이지</h2>

<!-- 정보 수정 폼 -->
<form th:action="@{/admin/updateAcademy}" method="post">
    <div class="form-group">
        <label>학원명:</label>
        <input type="text" name="name" th:value="${academy.name}" required />
    </div>
    <div class="form-group">
        <label>주소:</label>
        <input type="text" name="address" th:value="${academy.address}" required />
    </div>
    <div class="form-group">
        <label for="phone">전화번호:</label>
        <input type="text" id="phone" name="phone" th:value="${academy.phone}" required />
    </div>
    <div class="form-group">
        <label for="business">사업자 등록번호:</label>
        <input type="text" id="business" name="businessCer" th:value="${academy.businessCer}" required />
    </div>

    <button type="submit">정보 수정하기</button>
</form>

<hr style="margin: 30px 0;"/>

<!-- 삭제 폼 (재확인 알림창 적용) -->
<form th:action="@{/admin/deleteAcademy}" method="post" onsubmit="return confirmDelete();">
    <p style="color: red; font-size: 13px;">* 주의: 학원을 삭제하면 관련 데이터가 완전히 사라지며 다시 복구할 수 없습니다.</p>
    <button type="submit" class="delete-btn">학원 삭제하기</button>
</form>

<script>
    function confirmDelete() {
        // 브라우저 기본 확인 창 띄우기 (취소를 누르면 전송이 취소됨)
        return confirm("정말로 학원을 삭제하시겠습니까?\n삭제 후에는 되돌릴 수 없습니다.");
    }
</script>

</body>
</html>
