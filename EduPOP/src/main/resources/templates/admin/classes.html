<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>학급 관리</title>
</head>

<body>

<h1>학급 관리</h1>

<div th:if="${#lists.isEmpty(academyClasses)}">
    <p>등록된 학급이 없습니다.</p>
</div>

<div th:unless="${#lists.isEmpty(academyClasses)}">

    <table border="1">

        <thead>
        <tr>
            <th>학급명</th>
            <th>학년</th>
            <th>정원</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="classInfo : ${academyClasses}"
            th:onclick="|location.href='@{/admin/classes/{classId}(classId=${classInfo.classId})}'|"
            style="cursor:pointer;">

            <td th:text="${classInfo.name}">

            </td>

            <td th:text="${classInfo.targetGrade + '학년'}">

            </td>

            <td th:text="${classInfo.maxStudents + '명'}">

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
