<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h2>👥 전체회원 목록</h2>
    <div style="display: flex; gap: 15px; align-items: center;">
    <!-- 역할별 보기 필터 -->
    <div>
        <label for="roleFilter" style="font-weight: bold;">역할별 보기: </label>
        <select id="roleFilter" onchange="filterUsers()" style="padding: 5px; font-size: 14px; margin-right: 20px;">
            <option value="ALL">전체 보기</option>
            <option value="STUDENT">학생 (STUDENT)</option>
            <option value="TEACHER">교사 (TEACHER)</option>
        </select>
    </div>

    <!-- 상태별 보기 필터 -->
    <div>
        <label for="statusFilter" style="font-weight: bold;">상태별 보기: </label>
        <select id="statusFilter" onchange="filterUsers()" style="padding: 5px; font-size: 14px;">
            <option value="ALL">전체 보기</option>
            <option value="PENDING">PENDING (승인 대기 중)</option>
            <option value="ACTIVE">ACTIVE (활동 중)</option>
            <option value="INACTIVE">INACTIVE (비활성)</option>
            <option value="WITHDRAWN">WITHDRAWN (탈퇴)</option>
        </select>
    </div>
</div>
</div>

<!-- 일괄 상태 변경을 위한 <form> 태그 -->
<form th:action="@{/admin/updateUsersStatusBatch}" method="post">

    <!-- 상단 일괄 제어 바 (선택한 회원 일괄 변경 도구) -->
    <div style="background-color: #f9f9f9; padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
        <span style="font-weight: bold; font-size: 14px;">선택한 회원 일괄 변경:</span>

        <!-- 변경할 상태 선택 드롭다운 -->
        <select name="status" style="padding: 5px;">
            <option value="ACTIVE">ACTIVE (활동중)</option>
            <option value="INACTIVE">INACTIVE (비활성)</option>
            <option value="PENDING">PENDING (대기중)</option>
            <option value="WITHDRAWN">WITHDRAWN (탈퇴)</option>
        </select>

        <!-- 일괄 변경 실행 버튼 -->
        <button type="submit" style="background-color: green; color: white; padding: 6px 12px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px;">
            일괄 적용하기
        </button>
    </div>

    <table border="1" style="width: 100%; text-align: center;">
        <thead>
        <tr>
            <!-- 전체 선택을 위한 체크박스 -->
            <th style="width: 40px;">
                <input type="checkbox" id="selectAll" onclick="toggleAll(this)" />
            </th>
            <th>아이디</th>
            <th>이름</th>
            <th>학년</th>
            <th>전화번호</th>
            <th>이메일</th>
            <th>클래스</th>
            <th>역할</th>
            <th>현재 상태</th>
            <th>개별 상태 변경</th>
        </tr>
        </thead>
        <tbody id="userTableBody">

        <!-- 역할 및 상태 보기를 위한 반복문 -->
        <tr th:each="u : ${allUsers}"
            th:data-status="${u.status.name()}"
            th:data-role="${u.role.name()}">

            <td>
                <!-- 개별 체크박스 (name="userIds") -->
                <input type="checkbox" name="userIds" th:value="${u.user_id}" class="userCheckbox" />
            </td>
            <td th:text="${u.login_id}">아이디</td>
            <td th:text="${u.name}">이름</td>
            <td th:text="${u.school_grade}">학년</td>
            <td th:text="${u.phone}">전화번호</td>
            <td th:text="${u.email}">이메일</td>
            <td th:text="${u.class_name != null ? u.class_name : '미배정'}">반 이름</td>
            <td th:text="${u.role}">역할</td>
            <td th:text="${u.status}" style="font-weight: bold;">상태</td>
            <td>
                <!-- 기존 개별 수정 폼 -->
                <form th:action="@{/admin/updateStatus}" method="post" style="display:inline;">
                    <input type="hidden" name="user_id" th:value="${u.user_id}" />

                    <select name="status" style="padding: 3px;">
                        <option value="ACTIVE" th:selected="${u.status.name() == 'ACTIVE'}">ACTIVE</option>
                        <option value="INACTIVE" th:selected="${u.status.name() == 'INACTIVE'}">INACTIVE</option>
                        <option value="PENDING" th:selected="${u.status.name() == 'PENDING'}">PENDING</option>
                        <option value="WITHDRAWN" th:selected="${u.status.name() == 'WITHDRAWN'}">WITHDRAWN</option>
                    </select>

                    <button type="submit" style="background-color: #007bff; color: white; border: none; padding: 4px 8px; border-radius: 3px;">개별 수정</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</form>

<!-- 자바스크립트 (필터링 + 전체 선택 기능) -->
<script>
    // 상태별 필터링 함수
    function filterUsers() {
        const selectedStatus = document.getElementById("statusFilter").value; //상태필터
        const selectedRole = document.getElementById("roleFilter").value; //역할필터

        const rows = document.querySelectorAll("#userTableBody tr");//표의 모든 줄 가져오기

        rows.forEach(row => { //가져온 줄의 상태,역할 확인
            const rowStatus = row.getAttribute("data-status");
            const rowRole = row.getAttribute("data-role");

            // 전체보기거나 상태가 똑같은지 검사
            const statusMatch = (selectedStatus === "ALL" || rowStatus === selectedStatus);
            // 전체보기거나 역할이 똑같은지 검사
            const roleMatch = (selectedRole === "ALL" || rowRole === selectedRole);
            //전체보기거나 전체보기와 상태,역할이 똑같으면 화면에 보여줌
            if (statusMatch && roleMatch) {
                row.style.display = "";
                //다른 목록은 화면에서 가림
            } else {
                row.style.display = "none";
            }
        });
        // 필터를 바꾸면 전체 선택 체크박스 초기화
        document.getElementById("selectAll").checked = false;
        toggleAll(document.getElementById("selectAll"));
    }

    // 전체 선택/해제 체크박스 함수
    function toggleAll(selectAllCheckbox) {
        const checkboxes = document.querySelectorAll('.userCheckbox');
        checkboxes.forEach(cb => {
            // 화면에 보이는(숨겨지지 않은) 행의 체크박스만 선택되게 하면 더 완벽합니다!
            if (cb.closest('tr').style.display !== 'none') {
                cb.checked = selectAllCheckbox.checked;
            }
        });
    }
</script>
</body>
</html>
