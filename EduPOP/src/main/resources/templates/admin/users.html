<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPOP - 회원 관리</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-theme.css}">
</head>
<body class="admin-page admin-members-page">

<div th:replace="~{layout/header :: header}"></div>
<div th:replace="~{layout/sidebar-admin :: sidebar}"></div>

<main class="admin-shell">
    <div class="admin-content">
        <header class="admin-page-header">
            <div>
                <span class="admin-eyebrow">Member Management</span>
                <h1>회원 관리</h1>
                <p>전체 <strong th:text="${#lists.size(allUsers)}">0</strong>명의 학생·교사 계정과 소속 정보를 관리합니다.</p>
            </div>
        </header>

        <section class="admin-quick-filters" aria-label="회원 빠른 필터">
            <button class="admin-filter-chip active" type="button" data-filter="ALL"
                    onclick="setMemberQuickFilter('ALL')">
                전체 <span id="memberCountAll">0</span>
            </button>
            <button class="admin-filter-chip" type="button" data-filter="PENDING"
                    onclick="setMemberQuickFilter('PENDING')">
                승인 대기 <span id="memberCountPending">0</span>
            </button>
            <button class="admin-filter-chip" type="button" data-filter="STUDENT"
                    onclick="setMemberQuickFilter('STUDENT')">
                학생 <span id="memberCountStudent">0</span>
            </button>
            <button class="admin-filter-chip" type="button" data-filter="TEACHER"
                    onclick="setMemberQuickFilter('TEACHER')">
                교사 <span id="memberCountTeacher">0</span>
            </button>
        </section>

        <section class="admin-filter-bar" aria-label="회원 검색 및 필터">
            <label class="admin-search-field" for="memberSearchInput">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
                </svg>
                <input class="admin-input" id="memberSearchInput" type="search"
                       placeholder="이름, 아이디, 이메일 검색" oninput="applyMemberFilters()">
            </label>

            <label>
                <span class="visually-hidden">역할 필터</span>
                <select class="admin-select" id="roleFilter" onchange="applyMemberFilters()">
                    <option value="ALL">역할 전체</option>
                    <option value="STUDENT">학생</option>
                    <option value="TEACHER">교사</option>
                </select>
            </label>

            <label>
                <span class="visually-hidden">상태 필터</span>
                <select class="admin-select" id="statusFilter" onchange="applyMemberFilters()">
                    <option value="ALL">상태 전체</option>
                    <option value="PENDING">승인 대기</option>
                    <option value="ACTIVE">활동 중</option>
                    <option value="INACTIVE">비활성</option>
                    <option value="WITHDRAWN">탈퇴</option>
                </select>
            </label>

            <button class="admin-filter-reset" type="button" onclick="resetMemberFilters()">필터 초기화</button>
            <span class="admin-result-count"><strong id="visibleMemberCount">0</strong>명 표시 중</span>
        </section>

        <section class="admin-table-card" aria-label="회원 목록">
            <div class="admin-table-scroll">
                <table class="admin-data-table">
                    <thead>
                    <tr>
                        <th class="admin-checkbox-cell">
                            <input class="admin-checkbox" id="selectAll" type="checkbox"
                                   onclick="toggleAllUsers(this.checked)" aria-label="보이는 회원 전체 선택">
                        </th>
                        <th>회원</th>
                        <th>학년</th>
                        <th>연락처</th>
                        <th>클래스</th>
                        <th>역할</th>
                        <th>상태</th>
                        <th style="text-align:right;">상태 변경</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody">
                    <tr class="member-row" th:each="u : ${allUsers}"
                        th:attr="data-status=${u.status.name()},
                                 data-role=${u.role.name()},
                                 data-search=|${u.name} ${u.loginId} ${u.email} ${u.phone} ${u.className}|">
                        <td class="admin-checkbox-cell">
                            <input class="admin-checkbox userCheckbox" type="checkbox" name="userIds"
                                   th:value="${u.userId}" form="memberBulkBar" aria-label="회원 선택">
                        </td>
                        <td>
                            <div class="member-identity">
                                <span class="member-avatar" th:text="${#strings.substring(u.name, 0, 1)}">회</span>
                                <span>
                                    <strong th:text="${u.name}">홍길동</strong>
                                    <small th:text="${u.loginId}">student01</small>
                                </span>
                            </div>
                        </td>
                        <td>
                            <span class="admin-grade-badge"
                                  th:text="${u.schoolGrade != null and !u.schoolGrade.isEmpty() ? u.schoolGrade : '미입력'}">
                                미입력
                            </span>
                        </td>
                        <td>
                            <div class="member-contact">
                                <strong th:text="${u.phone != null and !u.phone.isEmpty() ? u.phone : '-'}">010-0000-0000</strong>
                                <span th:text="${u.email != null and !u.email.isEmpty() ? u.email : '-'}">user@edupop.kr</span>
                            </div>
                        </td>
                        <td th:text="${u.className != null and !u.className.isEmpty() ? u.className : '미배정'}">미배정</td>
                        <td>
                            <span class="admin-role-badge"
                                  th:classappend="${u.role.name() == 'STUDENT'} ? ' admin-role-student' : ' admin-role-teacher'"
                                  th:text="${u.role.name() == 'STUDENT' ? '학생' : '교사'}">학생</span>
                        </td>
                        <td>
                            <th:block th:switch="${u.status.name()}">
                                <span th:case="'ACTIVE'" class="admin-status admin-status-active">활동 중</span>
                                <span th:case="'PENDING'" class="admin-status admin-status-pending">승인 대기</span>
                                <span th:case="'INACTIVE'" class="admin-status admin-status-inactive">비활성</span>
                                <span th:case="'WITHDRAWN'" class="admin-status admin-status-withdrawn">탈퇴</span>
                            </th:block>
                        </td>
                        <td>
                            <form class="individual-status-form" th:action="@{/admin/updateStatus}" method="post"
                                  th:data-user-name="${u.name}" onsubmit="return confirmSingleStatus(this)">
                                <input type="hidden" name="userId" th:value="${u.userId}">
                                <select class="admin-select" name="status" th:aria-label="|${u.name} 상태 선택|">
                                    <option value="ACTIVE" th:selected="${u.status.name() == 'ACTIVE'}">활동 중</option>
                                    <option value="PENDING" th:selected="${u.status.name() == 'PENDING'}">승인 대기</option>
                                    <option value="INACTIVE" th:selected="${u.status.name() == 'INACTIVE'}">비활성</option>
                                    <option value="WITHDRAWN" th:selected="${u.status.name() == 'WITHDRAWN'}">탈퇴</option>
                                </select>
                                <button class="ui-button ui-button-secondary ui-button-small" type="submit">적용</button>
                            </form>
                        </td>
                    </tr>

                    <tr class="admin-empty-row" th:if="${#lists.isEmpty(allUsers)}">
                        <td colspan="8">
                            <div class="admin-empty-state">
                                <strong>등록된 회원이 아직 없습니다.</strong>
                                <span>학생 또는 교사가 가입하면 이곳에 표시됩니다.</span>
                            </div>
                        </td>
                    </tr>
                    <tr class="admin-empty-row" id="memberNoResults" hidden>
                        <td colspan="8">
                            <div class="admin-empty-state">
                                <strong>조건에 맞는 회원을 찾지 못했어요.</strong>
                                <span>검색어나 필터를 바꿔보세요.</span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<form class="admin-bulk-bar" id="memberBulkBar" th:action="@{/admin/updateUsersStatusBatch}"
      method="post" onsubmit="return validateBatchUpdate()">
    <span class="admin-bulk-count"><strong id="selectedMemberCount">0</strong>명 선택됨</span>
    <span class="admin-bulk-divider" aria-hidden="true"></span>
    <label>
        <span class="visually-hidden">일괄 변경 상태</span>
        <select class="admin-select" id="batchStatus" name="status">
            <option value="ACTIVE">활동 중</option>
            <option value="PENDING">승인 대기</option>
            <option value="INACTIVE">비활성</option>
            <option value="WITHDRAWN">탈퇴</option>
        </select>
    </label>
    <button class="ui-button ui-button-primary ui-button-small" type="submit">일괄 적용</button>
    <button class="admin-icon-button" type="button" onclick="clearMemberSelection()" aria-label="선택 해제"
            style="color:rgba(255,255,255,.7);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
    </button>
</form>

</body>
</html>
