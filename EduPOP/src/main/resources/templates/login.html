<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 로그인</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="login-main-container">

    <section class="login-main-card">

        <div class="login-main-header">
            <p class="login-label">EDUPOP</p>

            <h1>EduPOP에 오신 것을 환영합니다!</h1>

            <p class="login-description">
                원하는 방법으로 로그인하거나 새로운 계정을 만들어주세요.
            </p>
        </div>

        <div class="login-option-area">

            <a href="/LocalLogin"
               class="login-option-button local-login-button">

                <span class="button-icon">👤</span>

                <span class="button-text">
                    일반 아이디로 로그인
                </span>

            </a>

            <a href="/kakao/login" class="kakao-login-button">

                <span class="naver-login-logo"></span>
                <span class="naver-login-text">카카오로 로그인</span>

            </a>

            <a href="/naver/login" class="naver-login-button">

                <span class="naver-login-logo">N</span>
                <span class="naver-login-text">네이버로 로그인</span>

            </a>

            <a href="/google/login" class="google-login-button">

                <span class="google-login-logo">G</span>
                <span class="google-login-text">구글로 로그인</span>

            </a>

            <p th:if="${param.error != null}"
               class="login-error-message">
                소셜 로그인에 실패했습니다. 다시 시도해주세요.
            </p>

        </div>

        <div class="signup-divider">
            <span>아직 계정이 없으신가요?</span>
        </div>

        <a href="/signUp"
           class="signup-button">

            일반 회원가입

        </a>

    </section>

</main>

</body>
</html>
