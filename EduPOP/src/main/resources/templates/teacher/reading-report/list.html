<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>독서 피드백 | EduPOP</title>

    <!-- 팀 공통 화면 모양과 독서 화면 전용 모양 적용 -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/reading.css}">
</head>

<body>

<!-- 팀 공통 상단 영역 불러오기 -->
<div th:replace="~{layout/header :: header}"></div>

<!-- 팀 공통 교사 사이드바 불러오기 -->
<div th:replace="~{layout/sidebar-teacher :: sidebar}"></div>

<main class="main-content">
    <div class="reading-page">

        <!-- 페이지 제목 영역 -->
        <div class="page-toolbar">
            <div>
                <p class="page-kicker">
                    학생 독서 관리
                </p>

                <h1 class="page-title">
                    독서 피드백
                </h1>

                <p class="page-description">
                    담당 반 학생들의 독서감상문을 확인하고 첨삭할 수 있습니다.
                </p>
            </div>
        </div>

        <!-- 컨트롤러가 전달한 성공 문구가 있을 때만 표시 -->
        <div class="alert alert-success"
             th:if="${successMessage != null}"
             th:text="${successMessage}">
            처리되었습니다.
        </div>

        <!-- 컨트롤러가 전달한 실패 문구가 있을 때만 표시 -->
        <div class="alert alert-error"
             th:if="${errorMessage != null}"
             th:text="${errorMessage}">
            오류가 발생했습니다.
        </div>

        <!-- 담당 학생이 작성한 감상문이 없을 때 표시 -->
        <section class="content-card empty-card"
                 th:if="${#lists.isEmpty(readingReports)}">

            <strong>
                담당 학생이 작성한 독서감상문이 없습니다.
            </strong>
        </section>

        <!-- 담당 학생이 작성한 감상문이 있을 때 표시 -->
        <section class="content-card table-card"
                 th:if="${!#lists.isEmpty(readingReports)}">

            <!-- 화면이 작을 때 표를 좌우로 이동할 수 있게 처리 -->
            <div class="table-wrap">

                <table class="reading-table">

                    <!-- 표 제목 -->
                    <thead>
                    <tr>
                        <th>학생</th>
                        <th>도서</th>
                        <th>감상문 제목</th>
                        <th>첨삭 상태</th>
                        <th></th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- 담당 학생들의 감상문 개수만큼 반복 -->
                    <tr th:each="report : ${readingReports}">

                        <!-- 감상문을 작성한 학생 이름 표시 -->
                        <td th:text="${studentNamesById[report.studentId]}">
                            학생 이름
                        </td>

                        <!-- 감상문과 연결된 도서 정보 표시 -->
                        <td>

                            <strong th:text="${booksById[report.bookId].title}">
                                도서 제목
                            </strong>

                            <!-- 저자가 없으면 저자 없음 표시 -->
                            <span class="table-subtext"
                                  th:text="${booksById[report.bookId].author != null
                                            and !#strings.isEmpty(booksById[report.bookId].author)
                                            ? booksById[report.bookId].author
                                            : '저자 없음'}">
                                저자
                            </span>
                        </td>

                        <!-- 감상문 제목이 없으면 기본 문구 표시 -->
                        <td th:text="${report.title != null
                                      and !#strings.isEmpty(report.title)
                                      ? report.title
                                      : '제목 없는 독서감상문'}">
                            감상문 제목
                        </td>

                        <!-- 교사 첨삭 등록 여부 표시 -->
                        <td>

                            <!-- 첨삭이 등록된 경우 -->
                            <span class="badge badge-success"
                                  th:if="${feedbacksByReportId[report.readingReportId] != null}">
                                첨삭 완료
                            </span>

                            <!-- 첨삭이 아직 등록되지 않은 경우 -->
                            <span class="badge badge-waiting"
                                  th:unless="${feedbacksByReportId[report.readingReportId] != null}">
                                첨삭 대기
                            </span>
                        </td>

                        <!-- 감상문 상세 화면 이동 버튼 -->
                        <td class="table-action-cell">

                            <a class="btn btn-secondary"
                               th:href="@{/teacher/reading-reports/{id}(id=${report.readingReportId})}">
                                확인
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

</body>
</html>
