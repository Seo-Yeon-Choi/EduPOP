<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>독서감상문 첨삭 | EduPOP</title>

    <!-- 팀 공통 화면 모양과 독서 화면 전용 모양 적용 -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/reading.css}">

    <!-- 첨삭 내용의 현재 글자 수 표시 -->
    <script th:src="@{/js/reading.js}" defer></script>
</head>

<body>

<!-- 팀 공통 상단 영역 불러오기 -->
<div th:replace="~{layout/header :: header}"></div>

<!-- 팀 공통 교사 사이드바 불러오기 -->
<div th:replace="~{layout/sidebar-teacher :: sidebar}"></div>

<main class="main-content">
    <div class="reading-page reading-detail-page">

        <!-- 감상문 제목과 작성 학생 표시 -->
        <div class="page-toolbar">
            <div>
                <p class="page-kicker">
                    학생 독서 관리
                </p>

                <!-- 감상문 제목이 없으면 기본 문구 표시 -->
                <h1 class="page-title"
                    th:text="${readingReport.title != null
                              and !#strings.isEmpty(readingReport.title)
                              ? readingReport.title
                              : '제목 없는 독서감상문'}">
                    감상문 제목
                </h1>

                <!-- 감상문을 작성한 학생 이름 표시 -->
                <p class="page-description"
                   th:text="|작성 학생: ${studentName}|">
                    작성 학생
                </p>
            </div>

            <a class="btn btn-secondary"
               th:href="@{/teacher/reading}">
                목록으로
            </a>
        </div>

        <!-- 컨트롤러가 전달한 첨삭 저장 성공 문구 표시 -->
        <div class="alert alert-success"
             th:if="${successMessage != null}"
             th:text="${successMessage}">
            처리되었습니다.
        </div>

        <!-- 컨트롤러가 전달한 첨삭 저장 실패 문구 표시 -->
        <div class="alert alert-error"
             th:if="${errorMessage != null}"
             th:text="${errorMessage}">
            오류가 발생했습니다.
        </div>

        <!-- 감상문과 연결된 도서 정보 -->
        <section class="content-card book-detail-card">

            <!-- 도서 표지 출력 -->
            <div class="book-cover book-cover-large">

                <img th:if="${book.coverImageUrl != null
                            and !#strings.isEmpty(book.coverImageUrl)}"
                     th:src="${book.coverImageUrl}"
                     th:alt="|${book.title} 표지|">

                <span th:unless="${book.coverImageUrl != null
                                 and !#strings.isEmpty(book.coverImageUrl)}">
                    표지 없음
                </span>
            </div>

            <!-- 도서 제목·저자·독서 횟수 출력 -->
            <div class="book-detail-info">

                <span class="badge badge-neutral"
                      th:text="|이 학생의 도서 독서 ${readingCount}회|">
                    독서 1회
                </span>

                <h2 th:text="${book.title}">
                    도서 제목
                </h2>

                <!-- 저자가 없으면 저자 없음 표시 -->
                <p th:text="${book.author != null
                             and !#strings.isEmpty(book.author)
                             ? book.author
                             : '저자 없음'}">
                    저자
                </p>
            </div>
        </section>

        <!-- 학생이 작성한 감상문 내용 -->
        <section class="content-card reading-section">

            <h2 class="section-title">
                학생 감상문
            </h2>

            <!-- 학생이 입력한 줄바꿈을 유지하면서 표시 -->
            <div class="report-content"
                 th:text="${readingReport.content}">
                감상문 내용
            </div>
        </section>

        <!-- 교사 첨삭 등록 또는 수정 영역 -->
        <section class="content-card reading-section feedback-form-section">

            <div class="section-title-row">
                <div>
                    <h2 class="section-title">
                        교사 첨삭
                    </h2>

                    <p class="section-description">
                        학생에게 전달할 피드백을 1,000자 이하로 작성하세요.
                    </p>
                </div>
            </div>

            <!-- 첨삭 내용을 POST(포스트, 저장) 방식으로 전송 -->
            <form th:action="@{/teacher/reading-reports/{id}/feedback(id=${readingReport.readingReportId})}"
                  th:object="${feedback}"
                  method="post">

                <div class="form-group">

                    <div class="textarea-label-row">

                        <label class="form-label"
                               for="feedbackContent">

                            첨삭 내용
                            <span class="required">필수</span>
                        </label>

                        <!-- 자바스크립트가 현재 첨삭 글자 수를 표시 -->
                        <span class="character-count">
                            <strong data-count-value>0</strong>
                            / 1,000자
                        </span>
                    </div>

                    <!-- 신규 첨삭 또는 기존 첨삭 내용 입력 -->
                    <textarea class="form-textarea feedback-textarea"
                              id="feedbackContent"
                              th:field="*{content}"
                              rows="10"
                              maxlength="1000"
                              data-character-input
                              required
                              placeholder="잘한 점과 보완하면 좋은 점을 작성하세요."></textarea>
                </div>

                <!-- 취소 및 첨삭 저장 버튼 -->
                <div class="form-actions">

                    <a class="btn btn-secondary"
                       th:href="@{/teacher/reading}">
                        취소
                    </a>

                    <!-- 첨삭 번호가 없으면 등록, 있으면 수정으로 표시 -->
                    <button class="btn btn-primary"
                            type="submit"
                            th:text="${feedback.feedbackId == null
                                      ? '첨삭 등록'
                                      : '첨삭 수정'}">
                        첨삭 저장
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>

</body>
</html>
