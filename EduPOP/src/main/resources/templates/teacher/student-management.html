<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 전체 학생 및 반별 마스터 관리</title>

    <link rel="stylesheet"
          as="style"
          crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/student-master.css}">
</head>

<body>

<th:block th:replace="~{layout/header :: header}"></th:block>
<th:block th:replace="~{layout/sidebar-teacher :: sidebar}"></th:block>

<div class="page-content-wrapper">

    <!-- 상단 학생 관리 영역 -->
    <section class="card student-header-card">

        <div class="student-header">
            <div>
                <h2 class="page-title">
                    👥 전체 학생 및 반별 마스터 관리
                </h2>

                <p class="page-description">
                    전체 학생을 조회하거나 반을 선택해 특정 반 학생만 확인할 수 있습니다.
                </p>
            </div>
        </div>

        <div class="class-toggle-container"
             id="classToggleGroup">

            <button type="button"
                    class="class-chip active"
                    onclick="filterStudents('ALL', this)">
                🔥 전체 학생 보기
            </button>

            <button th:each="cls : ${teacherClasses}"
                    type="button"
                    class="class-chip"
                    th:data-class-id="${cls.classId}"
                    th:data-class-name="${cls.name}"
                    th:text="${cls.name}"
                    onclick="filterStudents(
                        this.getAttribute('data-class-id'),
                        this
                    )">
                반 이름
            </button>

        </div>

    </section>


    <!-- 학생 목록 영역 -->
    <section class="card student-list-card">

        <div class="list-header">
            <h3 id="currentViewTitle"
                class="list-title">
                📂 전체 학생 명단
            </h3>
        </div>

        <div id="studentTableContainer"
             class="student-table-container">

            <p class="empty-message">
                학생 데이터를 불러오는 중입니다...
            </p>

        </div>

    </section>

</div>


<script>

    let allStudentsCache = [];
    let classMap = {};


    document.addEventListener(
        'DOMContentLoaded',
        function () {

            document
                .querySelectorAll(
                    '.class-chip[data-class-id]'
                )
                .forEach(function (btn) {

                    classMap[
                        btn.getAttribute(
                            'data-class-id'
                        )
                        ] =
                        btn.getAttribute(
                            'data-class-name'
                        );
                });

            loadAllAcademyStudents();
        }
    );


    function loadAllAcademyStudents() {

        const classIds =
            Object.keys(classMap);


        if (classIds.length === 0) {

            document.getElementById(
                'studentTableContainer'
            ).innerHTML =
                '<p class="empty-message">' +
                '등록된 반이 없습니다.' +
                '</p>';

            return;
        }


        const promises =
            classIds.map(function (cId) {

                return fetch(
                    `/analytics/teacher/api/class/${cId}/students`
                )
                    .then(function (res) {

                        return res.json();

                    })
                    .then(function (students) {

                        return (students || [])
                            .map(function (st) {

                                return {
                                    ...st,
                                    classId: cId,
                                    className:
                                        st.className ||
                                        classMap[cId]
                                };
                            });
                    })
                    .catch(function () {

                        return [];
                    });
            });


        Promise
            .all(promises)
            .then(function (results) {

                const uniqueMap =
                    new Map();


                results
                    .flat()
                    .forEach(function (st) {

                        const studentId =
                            st.studentId ||
                            st.userId;


                        if (
                            studentId &&
                            !uniqueMap.has(
                                studentId
                            )
                        ) {

                            uniqueMap.set(
                                studentId,
                                st
                            );
                        }
                    });


                allStudentsCache =
                    Array.from(
                        uniqueMap.values()
                    );


                renderStudentTable(
                    allStudentsCache
                );
            });
    }


    function filterStudents(
        classId,
        element
    ) {

        document
            .querySelectorAll(
                '.class-chip'
            )
            .forEach(function (btn) {

                btn.classList.remove(
                    'active'
                );
            });


        element.classList.add(
            'active'
        );


        const title =
            document.getElementById(
                'currentViewTitle'
            );


        if (classId === 'ALL') {

            title.innerText =
                '📂 전체 학생 명단';

            renderStudentTable(
                allStudentsCache
            );

            return;
        }


        const targetName =
            classMap[classId] ||
            '선택된 반';


        title.innerText =
            `📂 [${targetName}] 소속 학생 명단`;


        const filtered =
            allStudentsCache.filter(
                function (student) {

                    return String(
                        student.classId
                    ) === String(
                        classId
                    );
                }
            );


        renderStudentTable(
            filtered
        );
    }


    function copyParentLink(
        studentName,
        studentId
    ) {

        const parentLinkUrl =
            window.location.origin +
            `/report-auth?studentId=${studentId}`;


        navigator.clipboard
            .writeText(parentLinkUrl)
            .then(function () {

                alert(
                    `✅ [${studentName} 학생] 학부모 성적 리포트 링크가 복사되었습니다!\n\n` +
                    `복사된 주소: ${parentLinkUrl}\n\n` +
                    `학부모님께 메신저나 문자로 전달해 주세요.`
                );

            })
            .catch(function (err) {

                console.error(
                    '링크 복사 실패:',
                    err
                );

                alert(
                    '❌ 링크 복사에 실패했습니다. ' +
                    '브라우저의 클립보드 권한을 확인해주세요.'
                );
            });
    }


    function renderStudentTable(
        students
    ) {

        let html = `

            <table class="student-table">

                <thead>
                    <tr>
                        <th>학생 이름</th>
                        <th>소속 반</th>
                        <th>이메일</th>
                        <th>연락처</th>
                        <th class="center-column">
                            📊 성적 결과
                        </th>
                        <th class="center-column">
                            🎯 퀘스트 결과
                        </th>
                        <th class="center-column">
                            🔗 학부모 성적 링크
                        </th>
                    </tr>
                </thead>

                <tbody>
        `;


        if (
            students &&
            students.length > 0
        ) {

            students.forEach(
                function (student) {

                    const studentId =
                        student.studentId ||
                        student.userId;


                    const assignedClassName =
                        student.className ||
                        '소속 반';


                    const trendUrl =
                        `/analytics/student-trend?studentId=${studentId}`;


                    const questUrl =
                        `/analytics/teacher/student/results?studentId=${studentId}`;


                    html += `

                        <tr>

                            <td class="student-name-cell">
                                ${escapeHtml(student.name || '')}
                            </td>

                            <td>
                                <span class="class-badge">
                                    ${escapeHtml(assignedClassName)}
                                </span>
                            </td>

                            <td class="muted-cell">
                                ${escapeHtml(
                        student.email ||
                        '등록된 이메일 없음'
                    )}
                            </td>

                            <td class="muted-cell">
                                ${escapeHtml(
                        student.phone ||
                        '연락처 없음'
                    )}
                            </td>

                            <td class="center-column">
                                <button type="button"
                                        class="btn-action btn-score"
                                        onclick="location.href='${trendUrl}'">
                                    성적 보기
                                </button>
                            </td>

                            <td class="center-column">
                                <button type="button"
                                        class="btn-action btn-quest"
                                        onclick="location.href='${questUrl}'">
                                    퀘스트 결과
                                </button>
                            </td>

                            <td class="center-column">
                                <button type="button"
                                        class="btn-action btn-parent"
                                        data-student-name="${escapeAttribute(student.name || '')}"
                                        data-student-id="${escapeAttribute(String(studentId))}"
                                        onclick="copyParentLink(
                                            this.dataset.studentName,
                                            this.dataset.studentId
                                        )">
                                    학부모 링크
                                </button>
                            </td>

                        </tr>
                    `;
                }
            );

        } else {

            html += `

                <tr>
                    <td colspan="7"
                        class="empty-table-cell">
                        해당 조건에 일치하는 학생이 없습니다.
                    </td>
                </tr>
            `;
        }


        html += `

                </tbody>

            </table>
        `;


        document.getElementById(
            'studentTableContainer'
        ).innerHTML = html;
    }


    function escapeHtml(value) {

        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }


    function escapeAttribute(value) {

        return escapeHtml(value);
    }

</script>

</body>
</html>
