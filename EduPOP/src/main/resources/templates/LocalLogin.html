<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPOP - 로그인</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/locallogin.css}">
</head>

<body class="entry-page auth-page">

<div th:replace="~{layout/header :: header}"></div>

<main class="entry-shell local-login-container">
    <section class="entry-card local-login-card">

        <a class="entry-brand local-login-brand" th:href="@{/}">
            <span class="entry-brand-mark" aria-hidden="true">EP</span>
            <span>EduPOP</span>
        </a>

        <div class="local-login-header">
            <p class="entry-eyebrow">Welcome Back</p>
            <h1 class="entry-title">다시 만나서 반가워요</h1>
            <p>회원가입한 계정으로 로그인해주세요.</p>
        </div>

        <form th:action="@{/login}" method="post" class="local-login-form">

            <div class="entry-form-group local-form-group">
                <label class="entry-form-label" for="loginId">아이디</label>

                <input
                        type="text"
                        id="loginId"
                        name="loginId"
                        placeholder="아이디를 입력해주세요."
                        class="entry-input"
                        autocomplete="username"
                        required
                        autofocus>
            </div>

            <div class="entry-form-group local-form-group">
                <label class="entry-form-label" for="passwordHash">비밀번호</label>

                <input
                        type="password"
                        id="passwordHash"
                        name="passwordHash"
                        class="entry-input"
                        placeholder="비밀번호를 입력해주세요."
                        autocomplete="current-password"
                        required>
            </div>

            <div th:if="${error != null}"
                 class="entry-message entry-message-error local-error-message">
                <p th:text="${error}"></p>
            </div>

            <button type="submit"
                    class="entry-button entry-button-primary local-login-button">
                로그인
            </button>

        </form>

        <div class="local-signup-area">
            <span>계정이 없으신가요?</span>

            <a href="/signUp"
               class="local-signup-link">
                회원가입
            </a>
        </div>

    </section>

</main>

<script th:if="${error != null}">
    alert("[[${error}]]");
</script>

<script th:if="${message != null}">
    alert("[[${message}]]");
</script>

</body>
</html>
