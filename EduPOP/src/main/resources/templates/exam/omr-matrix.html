<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>EduPOP - 스마트 OMR 채점 및 의견 관리</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/omr-matrix.css}">
</head>

<body>

<th:block th:replace="~{layout/header :: header}"></th:block>
<th:block th:replace="~{layout/sidebar-teacher :: sidebar}"></th:block>

<div id="toastContainer" class="toast-container"></div>

<div class="page-content-wrapper">

    <!-- 상단 시험 정보 -->
    <div class="card header-top-box">

        <div class="header-back-row">
            <a th:href="@{/exam/list}" class="back-link">
                ← 시험 목록으로 돌아가기
            </a>
        </div>

        <div class="header-main-row">

            <div class="exam-info">

                <h1 class="exam-title">
                    <span class="exam-round-badge"
                          th:text="${exam.examRound} + '회차'">
                        1회차
                    </span>

                    <span th:text="${exam.title}">
                        시험명
                    </span>
                </h1>

                <p class="exam-meta">

                    배정 반:
                    <b class="exam-class-name"
                       th:text="${exam.className}">
                        반 이름
                    </b>

                    <span class="meta-divider">|</span>

                    시행일:
                    <span th:text="${exam.examDate}">
                        2026-08-25
                    </span>

                    <span class="meta-divider">|</span>

                    문항수:
                    <span class="question-count"
                          th:text="${exam.questions.size()} + '문항'">
                        20문항
                    </span>

                </p>

            </div>

            <div class="header-actions">

                <a th:href="@{/analytics/class-trend(
                        examId=${exam.examId},
                        classId=${exam.classId}
                    )}"
                   class="btn-secondary btn-analysis">
                    📊 반 성적 분석 보기
                </a>

                <button type="button"
                        onclick="openCommentModal()"
                        class="btn-secondary header-action-button">
                    ✍️ 학생별 의견작성
                </button>

                <div class="header-action-divider"></div>

                <button type="button"
                        id="btnSaveGrades"
                        class="btn-primary btn-save-all">
                    💾 반 전체 점수 일괄 저장
                </button>

            </div>

        </div>

    </div>


    <!-- 전체 정답 기준표 -->
    <div class="master-container">

        <div class="master-header">

            <span class="master-title">
                📋 전체 정답 기준표
                (<span th:text="${exam.questions.size()}">20</span>문항)

                <span class="master-description">
                    - 번호를 누르면 문항 정보를 볼 수 있습니다.
                </span>
            </span>

            <div id="chipInfoBadge"
                 class="chip-info-badge">

                <span id="badgeQNum">
                    1번 문항
                </span>

                <span>|</span>

                <span>
                    영역:
                    <b id="badgeQType" class="badge-question-type">
                        VOCAB
                    </b>
                </span>

                <span>|</span>

                <span>
                    배점:
                    <b id="badgeQScore" class="badge-question-score">
                        5점
                    </b>
                </span>

                <span>|</span>

                <span>
                    정답:
                    <b id="badgeQAns" class="badge-question-answer">
                        3
                    </b>
                </span>

            </div>

        </div>


        <div class="master-grid"
             id="masterChipGrid">

            <div th:each="q : ${exam.questions}"
                 class="chip"
                 th:data-qid="${q.questionId}"
                 th:data-qnum="${q.questionNumber}"
                 th:data-qtype="${q.questionType}"
                 th:data-score="${q.score}"
                 th:data-ans="${q.correctAnswer}">

                <span class="q-label"
                      th:text="${q.questionNumber} + '번'">
                    1번
                </span>

                <span class="q-val"
                      th:text="${q.correctAnswer}">
                    1
                </span>

            </div>

        </div>

    </div>


    <!-- 학생 OMR 입력 -->
    <div class="card omr-card">

        <table class="common-table"
               id="omrTable"
               th:data-exam-id="${exam.examId}">

            <thead>

            <tr>
                <th class="student-column">
                    수강생
                </th>

                <th class="answer-column">
                    답안 고속 입력 및 개별 저장
                </th>

                <th>
                    실시간 정오답(O/X) 현황
                </th>

                <th class="score-column">
                    총점
                </th>
            </tr>

            </thead>


            <tbody id="studentRowList">

            <tr th:each="stu : ${exam.students}"
                class="student-row"
                th:data-student-id="${stu.studentId}"
                th:data-student-name="${stu.studentName}">

                <!-- 학생 정보 -->
                <td>

                    <div class="student-name"
                         th:text="${stu.studentName}">
                        김철수
                    </div>

                    <div class="student-sub-info">

                        <span class="student-grade"
                              th:text="${stu.schoolGrade}">
                            중2
                        </span>

                        <a th:href="@{/analytics/student-trend(
                                studentId=${stu.studentId},
                                examId=${exam.examId}
                            )}"
                           class="btn-secondary btn-student-analysis">
                            📊 성적분석
                        </a>

                    </div>

                </td>


                <!-- 답안 입력 -->
                <td class="answer-input-cell">

                    <div class="answer-input-wrapper">

                        <input type="text"
                               class="form-input answer-input"
                               placeholder="답안을 입력하세요..."
                               th:value="${stu.savedAnswers}"
                               th:readonly="${stu.isGraded}">

                        <span class="count-pill">

                            <span class="curr-cnt">
                                0
                            </span>

                            /

                            <span th:text="${exam.questions.size()}">
                                20
                            </span>

                        </span>

                        <button type="button"
                                class="btn-row-action"
                                onclick="handleRowAction(this)"
                                th:text="${stu.isGraded != null and stu.isGraded
                                    ? '수정'
                                    : '💾 저장'}">
                            수정
                        </button>

                    </div>

                </td>


                <!-- 정오답 -->
                <td>
                    <div class="ox-wrap"></div>
                </td>


                <!-- 총점 -->
                <td>
                    <span class="score-badge student-total-score">
                        0
                    </span>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- 학생별 의견 작성 모달 -->
<div id="commentModal"
     class="modal-overlay">

    <div class="modal-box">

        <div class="modal-header">

            <h3 class="modal-title">
                ✍️ 학부모 리포트용 코멘트 작성
            </h3>

            <button type="button"
                    class="modal-close"
                    onclick="closeCommentModal()">
                ✕
            </button>

        </div>


        <div class="comment-list">

            <div th:each="stu : ${exam.students}"
                 class="comment-item">

                <label class="comment-label"
                       th:text="${stu.studentName} + ' 학생'">
                    학생
                </label>

                <textarea class="form-input comment-textarea"
                          th:data-student-id="${stu.studentId}"
                          th:text="${stu.teacherComment != null
                              ? stu.teacherComment
                              : ''}"
                          placeholder="학부모 리포트에 반영될 코멘트를 작성해주세요."></textarea>

            </div>

        </div>


        <div class="modal-actions">

            <button type="button"
                    class="btn-secondary"
                    onclick="closeCommentModal()">
                취소
            </button>

            <button type="button"
                    class="btn-primary"
                    onclick="saveComments()">
                의견 저장하기
            </button>

        </div>

    </div>

</div>


<script>

    const csrfToken =
        document.querySelector('meta[name="_csrf"]').content;

    const csrfHeader =
        document.querySelector('meta[name="_csrf_header"]').content;


    function openCommentModal() {

        var modal =
            document.getElementById('commentModal');

        if (modal) {
            modal.classList.add('open');
        }
    }


    function closeCommentModal() {

        var modal =
            document.getElementById('commentModal');

        if (modal) {
            modal.classList.remove('open');
        }
    }


    function showToast(message, type) {

        type = type || 'success';

        var container =
            document.getElementById('toastContainer');

        var toast =
            document.createElement('div');

        toast.className =
            'toast-card ' + type;

        var icon =
            type === 'success'
                ? '✅'
                : '⚠️';

        toast.innerHTML =
            '<span>' +
            icon +
            '</span><span>' +
            message +
            '</span>';

        container.appendChild(toast);

        setTimeout(function () {

            toast.classList.add('show');

        }, 10);


        setTimeout(function () {

            toast.classList.remove('show');

            setTimeout(function () {

                toast.remove();

            }, 300);

        }, 2500);
    }


    function handleRowAction(btn) {

        var row =
            btn.closest('.student-row');

        var input =
            row.querySelector('.answer-input');

        var isReadOnly =
            input.hasAttribute('readonly');


        if (isReadOnly) {

            input.removeAttribute('readonly');

            input.focus();

            var valLen =
                input.value.length;

            input.setSelectionRange(
                valLen,
                valLen
            );

            btn.innerText =
                '💾 저장';

            btn.classList.add(
                'edit-mode'
            );

            showToast(
                row.getAttribute('data-student-name') +
                ' 학생의 답안 수정 모드가 활성화되었습니다.',
                'success'
            );

        } else {

            saveSingleStudent(
                row,
                btn
            );
        }
    }


    function saveSingleStudent(row, btn) {

        var examId =
            parseInt(
                document
                    .getElementById('omrTable')
                    .getAttribute('data-exam-id')
            ) || 1;


        var studentId =
            parseInt(
                row.getAttribute('data-student-id')
            ) || 0;


        var studentName =
            row.getAttribute('data-student-name') || '';


        var input =
            row.querySelector('.answer-input');


        var tokens =
            extractTokens(input.value);


        var ta =
            document.querySelector(
                '.comment-textarea[data-student-id="' +
                studentId +
                '"]'
            );


        var comment =
            ta
                ? ta.value.trim()
                : '';


        var chips =
            document.querySelectorAll('.chip');


        var answers = [];


        for (var i = 0; i < chips.length; i++) {

            var c =
                chips[i];

            answers.push({

                questionId:
                    parseInt(
                        c.getAttribute('data-qid')
                    ) || 0,

                questionNumber:
                    parseInt(
                        c.getAttribute('data-qnum')
                    ) || (i + 1),

                submittedAnswer:
                    tokens[i] || '',

                correctAnswer:
                    (
                        c.getAttribute('data-ans') ||
                        ''
                    ).trim(),

                score:
                    parseFloat(
                        c.getAttribute('data-score')
                    ) || 5,

                questionType:
                    c.getAttribute('data-qtype') ||
                    'VOCAB'
            });
        }


        var payload = {

            examId: examId,

            studentGrades: [
                {
                    studentId: studentId,
                    answers: answers,
                    teacherComment: comment
                }
            ]
        };


        fetch('/exam/api/save-grades', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },

            body: JSON.stringify(payload)

        })
            .then(function (res) {

                if (!res.ok) {
                    throw new Error(
                        '서버 처리 실패'
                    );
                }

                return res.json();
            })
            .then(function () {

                input.setAttribute(
                    'readonly',
                    'readonly'
                );

                btn.innerText =
                    '수정';

                btn.classList.remove(
                    'edit-mode'
                );

                showToast(
                    studentName +
                    ' 학생의 채점 결과가 성공적으로 저장되었습니다!',
                    'success'
                );

            })
            .catch(function () {

                showToast(
                    studentName +
                    ' 학생의 성적 저장 중 오류가 발생했습니다.',
                    'error'
                );

            });
    }


    function saveComments() {

        var examId =
            parseInt(
                document
                    .getElementById('omrTable')
                    .getAttribute('data-exam-id')
            ) || 0;


        var comments = [];


        document
            .querySelectorAll('.comment-textarea')
            .forEach(function (ta) {

                var sid =
                    parseInt(
                        ta.getAttribute(
                            'data-student-id'
                        )
                    );

                var txt =
                    ta.value.trim();

                comments.push({
                    studentId: sid,
                    comment: txt
                });

            });


        if (comments.length === 0) {

            closeCommentModal();

            return;
        }


        fetch('/exam/api/save-comments', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },

            body: JSON.stringify({

                examId: examId,

                comments: comments

            })

        })
            .then(function (res) {

                if (!res.ok) {
                    throw new Error();
                }

                showToast(
                    '작성하신 학생별 의견이 성공적으로 저장되었습니다.',
                    'success'
                );

                closeCommentModal();

            })
            .catch(function () {

                showToast(
                    '의견 저장 중 서버 오류가 발생했습니다.',
                    'error'
                );

            });
    }


    function showExamStats(examId, classId) {

        if (!classId) {
            classId = 1;
        }


        fetch(
            '/exam/api/stats?examId=' +
            examId +
            '&classId=' +
            classId
        )
            .then(function (res) {

                return res.json();

            })
            .then(function (data) {

                alert(
                    '📊 [성적 통계 요약]\n\n' +
                    '해당 반 평균: ' +
                    data.classAvg +
                    '점\n' +
                    '시험 전체 응시자 평균: ' +
                    data.totalAvg +
                    '점'
                );

            })
            .catch(function () {

                alert(
                    '통계 데이터를 불러올 수 없습니다.'
                );

            });
    }


    (function () {

        function getQuestionList() {

            var chips =
                document.querySelectorAll('.chip');

            var list = [];


            for (
                var i = 0;
                i < chips.length;
                i++
            ) {

                var c =
                    chips[i];

                list.push({

                    id:
                        parseInt(
                            c.getAttribute('data-qid')
                        ) || 0,

                    num:
                        parseInt(
                            c.getAttribute('data-qnum')
                        ) || (i + 1),

                    type:
                        c.getAttribute('data-qtype') ||
                        'VOCAB',

                    score:
                        parseFloat(
                            c.getAttribute('data-score')
                        ) || 5,

                    ans:
                        (
                            c.getAttribute('data-ans') ||
                            ''
                        ).trim()

                });
            }


            return list;
        }


        window.extractTokens = function (val) {

            if (!val) {
                return [];
            }

            var trimmed =
                val.trim();

            if (!trimmed) {
                return [];
            }


            var rawSegments = [];

            var quoteRegex =
                /"([^"]*)"|([^"]+)/g;

            var match;


            while (
                (
                    match =
                        quoteRegex.exec(trimmed)
                ) !== null
                ) {

                if (
                    match[1] !== undefined
                ) {

                    if (
                        match[1]
                            .trim()
                            .length > 0
                    ) {

                        rawSegments.push({
                            isQuote: true,
                            text: match[1].trim()
                        });

                    }

                } else if (
                    match[2] !== undefined
                ) {

                    if (
                        match[2]
                            .trim()
                            .length > 0
                    ) {

                        rawSegments.push({
                            isQuote: false,
                            text: match[2].trim()
                        });

                    }
                }
            }


            var finalTokens = [];


            rawSegments.forEach(
                function (seg) {

                    if (seg.isQuote) {

                        finalTokens.push(
                            seg.text
                        );

                    } else {

                        var parts =
                            seg.text
                                .split(/[\s/]+/)
                                .filter(
                                    function (p) {
                                        return p.length > 0;
                                    }
                                );


                        parts.forEach(
                            function (part) {

                                if (
                                    /^[\d\-]+$/.test(
                                        part
                                    )
                                ) {

                                    for (
                                        var j = 0;
                                        j < part.length;
                                        j++
                                    ) {

                                        finalTokens.push(
                                            part[j]
                                        );
                                    }

                                } else {

                                    finalTokens.push(
                                        part
                                    );
                                }
                            }
                        );
                    }
                }
            );


            return finalTokens;
        };


        function evaluateRow(
            row,
            input,
            qList
        ) {

            var tokens =
                extractTokens(input.value);

            var totalQ =
                qList.length;


            if (
                tokens.length > totalQ &&
                totalQ > 0
            ) {

                tokens =
                    tokens.slice(
                        0,
                        totalQ
                    );
            }


            var oxBox =
                row.querySelector(
                    '.ox-wrap'
                );

            oxBox.innerHTML =
                '';


            var score =
                0;

            var tokenLen =
                tokens.length;


            var currCntSpan =
                row.querySelector(
                    '.curr-cnt'
                );

            var progBadge =
                row.querySelector(
                    '.count-pill'
                );


            if (currCntSpan) {

                currCntSpan.innerText =
                    tokenLen;
            }


            if (progBadge) {

                if (
                    tokenLen >= totalQ &&
                    totalQ > 0
                ) {

                    progBadge
                        .classList
                        .add('done');

                    progBadge.innerText =
                        totalQ +
                        '/' +
                        totalQ +
                        ' 완료 ✓';

                } else {

                    progBadge
                        .classList
                        .remove('done');

                    progBadge.innerHTML =
                        '<span class="curr-cnt">' +
                        tokenLen +
                        '</span>/' +
                        totalQ;
                }
            }


            for (
                var idx = 0;
                idx < qList.length;
                idx++
            ) {

                var q =
                    qList[idx];

                var sub =
                    tokens[idx];


                var isAnswered =
                    sub !== undefined &&
                    sub !== '';


                var isSkipped =
                    sub === '0' ||
                    sub === '-';


                var isCorrect =
                    isAnswered &&
                    !isSkipped &&
                    (
                        String(sub)
                            .trim()
                            .toLowerCase()
                        ===
                        String(q.ans)
                            .trim()
                            .toLowerCase()
                    );


                var badge =
                    document.createElement(
                        'span'
                    );


                badge.className =
                    'ox-item';


                if (!isAnswered) {

                    if (
                        idx === tokenLen
                    ) {

                        badge.className +=
                            ' ox-curr';

                        badge.innerText =
                            (idx + 1) +
                            '번▶';

                    } else {

                        badge.className +=
                            ' ox-none';

                        badge.innerText =
                            (idx + 1) +
                            ':-';
                    }

                } else if (isCorrect) {

                    badge.className +=
                        ' ox-pass';

                    badge.innerText =
                        (idx + 1) +
                        ':O';

                    score +=
                        q.score;

                } else if (isSkipped) {

                    badge.className +=
                        ' ox-skip';

                    badge.innerText =
                        (idx + 1) +
                        ':미응시';

                } else {

                    badge.className +=
                        ' ox-fail';

                    badge.innerText =
                        (idx + 1) +
                        ':X(' +
                        sub +
                        ')';
                }


                oxBox.appendChild(
                    badge
                );
            }


            var scoreSpan =
                row.querySelector(
                    '.student-total-score'
                );


            if (scoreSpan) {

                scoreSpan.innerText =
                    score;
            }
        }


        function initApp() {

            var qList =
                getQuestionList();

            var rows =
                document.querySelectorAll(
                    '.student-row'
                );

            var inputs =
                document.querySelectorAll(
                    '.answer-input'
                );


            var chips =
                document.querySelectorAll(
                    '.chip'
                );

            var infoBadge =
                document.getElementById(
                    'chipInfoBadge'
                );

            var bNum =
                document.getElementById(
                    'badgeQNum'
                );

            var bType =
                document.getElementById(
                    'badgeQType'
                );

            var bScore =
                document.getElementById(
                    'badgeQScore'
                );

            var bAns =
                document.getElementById(
                    'badgeQAns'
                );


            chips.forEach(
                function (chip) {

                    chip.addEventListener(
                        'click',
                        function () {

                            chips.forEach(
                                function (c) {
                                    c.classList.remove(
                                        'active'
                                    );
                                }
                            );


                            chip.classList.add(
                                'active'
                            );


                            if (bNum) {

                                bNum.innerText =
                                    (
                                        chip.getAttribute(
                                            'data-qnum'
                                        ) || '1'
                                    ) +
                                    '번 문항';
                            }


                            if (bType) {

                                bType.innerText =
                                    chip.getAttribute(
                                        'data-qtype'
                                    ) || '공통';
                            }


                            if (bScore) {

                                bScore.innerText =
                                    (
                                        chip.getAttribute(
                                            'data-score'
                                        ) || '5'
                                    ) +
                                    '점';
                            }


                            if (bAns) {

                                bAns.innerText =
                                    chip.getAttribute(
                                        'data-ans'
                                    ) || '-';
                            }


                            if (infoBadge) {

                                infoBadge
                                    .classList
                                    .add('visible');
                            }
                        }
                    );
                }
            );


            rows.forEach(
                function (row, rIdx) {

                    var input =
                        row.querySelector(
                            '.answer-input'
                        );


                    evaluateRow(
                        row,
                        input,
                        qList
                    );


                    input.addEventListener(
                        'input',
                        function () {

                            evaluateRow(
                                row,
                                input,
                                qList
                            );
                        }
                    );


                    input.addEventListener(
                        'keydown',
                        function (e) {

                            if (
                                input.hasAttribute(
                                    'readonly'
                                )
                            ) {
                                return;
                            }


                            var currentTokens =
                                extractTokens(
                                    input.value
                                );


                            var totalQ =
                                qList.length;


                            var allowKeys = [
                                'Backspace',
                                'Delete',
                                'ArrowLeft',
                                'ArrowRight',
                                'ArrowUp',
                                'ArrowDown',
                                'Tab',
                                'Enter'
                            ];


                            if (
                                allowKeys.indexOf(
                                    e.key
                                ) !== -1 ||
                                e.ctrlKey ||
                                e.metaKey
                            ) {

                                if (
                                    e.key ===
                                    'Enter' ||
                                    e.key ===
                                    'ArrowDown'
                                ) {

                                    e.preventDefault();


                                    if (
                                        rIdx + 1 <
                                        inputs.length
                                    ) {

                                        inputs[
                                        rIdx + 1
                                            ].focus();

                                        inputs[
                                        rIdx + 1
                                            ].select();
                                    }

                                } else if (
                                    e.key ===
                                    'ArrowUp'
                                ) {

                                    e.preventDefault();


                                    if (
                                        rIdx - 1 >= 0
                                    ) {

                                        inputs[
                                        rIdx - 1
                                            ].focus();

                                        inputs[
                                        rIdx - 1
                                            ].select();
                                    }
                                }


                                return;
                            }


                            if (
                                currentTokens.length >=
                                totalQ &&
                                totalQ > 0
                            ) {

                                e.preventDefault();
                            }
                        }
                    );
                }
            );


            var btnSave =
                document.getElementById(
                    'btnSaveGrades'
                );


            if (btnSave) {

                btnSave.addEventListener(
                    'click',
                    function () {

                        var examId =
                            parseInt(
                                document
                                    .getElementById(
                                        'omrTable'
                                    )
                                    .getAttribute(
                                        'data-exam-id'
                                    )
                            ) || 1;


                        var studentGrades =
                            [];


                        var commentsMap =
                            {};


                        document
                            .querySelectorAll(
                                '.comment-textarea'
                            )
                            .forEach(
                                function (ta) {

                                    var sid =
                                        parseInt(
                                            ta.getAttribute(
                                                'data-student-id'
                                            )
                                        );

                                    commentsMap[sid] =
                                        ta.value.trim();
                                }
                            );


                        rows.forEach(
                            function (row) {

                                var studentId =
                                    parseInt(
                                        row.getAttribute(
                                            'data-student-id'
                                        )
                                    ) || 0;


                                var tokens =
                                    extractTokens(
                                        row
                                            .querySelector(
                                                '.answer-input'
                                            )
                                            .value
                                    );


                                var answers =
                                    [];


                                qList.forEach(
                                    function (
                                        q,
                                        idx
                                    ) {

                                        answers.push({

                                            questionId:
                                            q.id,

                                            questionNumber:
                                            q.num,

                                            submittedAnswer:
                                                tokens[idx] ||
                                                '',

                                            correctAnswer:
                                            q.ans,

                                            score:
                                            q.score,

                                            questionType:
                                            q.type
                                        });
                                    }
                                );


                                studentGrades.push({

                                    studentId:
                                    studentId,

                                    answers:
                                    answers,

                                    teacherComment:
                                        commentsMap[
                                            studentId
                                            ] || ''
                                });
                            }
                        );


                        var payload = {

                            examId:
                            examId,

                            studentGrades:
                            studentGrades
                        };


                        fetch(
                            '/exam/api/save-grades',
                            {

                                method:
                                    'POST',

                                headers: {

                                    'Content-Type':
                                        'application/json',

                                    [csrfHeader]:
                                    csrfToken
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        )
                            .then(
                                function (res) {

                                    if (!res.ok) {

                                        throw new Error(
                                            '서버 처리 실패'
                                        );
                                    }

                                    return res.json();
                                }
                            )
                            .then(
                                function () {

                                    showToast(
                                        '반 전체 채점 결과가 성공적으로 저장되었습니다.',
                                        'success'
                                    );


                                    setTimeout(
                                        function () {

                                            window.location.reload();

                                        },
                                        1000
                                    );
                                }
                            )
                            .catch(
                                function () {

                                    showToast(
                                        '채점 결과 저장 중 오류가 발생했습니다.',
                                        'error'
                                    );
                                }
                            );
                    }
                );
            }
        }


        if (
            document.readyState ===
            'loading'
        ) {

            document.addEventListener(
                'DOMContentLoaded',
                initApp
            );

        } else {

            initApp();
        }

    })();

</script>

</body>
</html>
