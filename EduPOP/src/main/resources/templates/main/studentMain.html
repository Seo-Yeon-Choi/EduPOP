<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPOP - 학생 메인</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/student-main.css}">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>
<div th:replace="~{layout/sidebar-student :: sidebar}"></div>

<main class="student-main-container">
    <section class="student-welcome">
        <div class="welcome-text">
            <p class="welcome-label">STUDENT</p>
            <h1>학생 페이지</h1>
            <p class="welcome-description">
                시험 응시, 복습, 학습 결과 등 EduPOP의 학습 기능을 이용할 수 있습니다.
            </p>
        </div>
    </section>

    <section class="student-menu-grid">
        <a href="/student/exams" class="student-menu-card">
            <div class="menu-icon">📝</div>
            <div class="menu-content">
                <h2>시험 및 복습</h2>
                <p>등록된 시험에 응시하고 오늘의 복습 문제를 확인합니다.</p>
            </div>
            <span class="menu-arrow">›</span>
        </a>

        <a href="/student/exams/results" class="student-menu-card">
            <div class="menu-icon">📊</div>
            <div class="menu-content">
                <h2>응시 결과</h2>
                <p>이전 시험과 복습 결과를 확인할 수 있습니다.</p>
            </div>
            <span class="menu-arrow">›</span>
        </a>
    </section>

    <section class="account-area">
        <div class="account-header">
            <h2>계정 관리</h2>
            <p>계정 정보를 확인하거나 로그아웃 및 회원 탈퇴를 할 수 있습니다.</p>
        </div>

        <div class="account-buttons">
            <a href="/logout" class="logout-button">로그아웃</a>

            <a href="/account" class="logout-button">계정정보 조회</a>

            <form th:action="@{/user/withdraw}"
                  method="post"
                  onsubmit="return confirm('정말 탈퇴하시겠습니까? 데이터는 1년간 안전하게 보관된 후 완전히 삭제됩니다.');">
                <button type="submit" class="withdraw-button">회원 탈퇴하기</button>
            </form>
        </div>

        <p class="withdraw-warning">
            회원 탈퇴 시 계정 사용이 중지되며, 관련 데이터는 정책에 따라 보관 후 삭제됩니다.
        </p>
    </section>
</main>

</body>
</html>
