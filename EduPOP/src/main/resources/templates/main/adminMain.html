<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 관리자 메인</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-home.css}">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div th:replace="~{layout/sidebar-admin :: sidebar}"></div>

<main class="admin-home-container">

    <section class="admin-welcome">

        <div>
            <p class="admin-user"
               th:text="${session.loginUser.name} + '님의 관리자 페이지'">
                관리자님의 관리자 페이지
            </p>

            <h1>관리자 메인 페이지에 오신 것을 환영합니다!</h1>

            <p class="admin-description">
                EduPOP의 학원 및 사용자 정보를 관리할 수 있습니다.
            </p>
        </div>

    </section>

    <section class="admin-dashboard">

        <div class="dashboard-card">
            <div class="dashboard-icon">🏫</div>

            <div class="dashboard-content">
                <h2>학원 관리</h2>
                <p>
                    등록된 학원 정보를 확인하고 관리할 수 있습니다.
                </p>
            </div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-icon">👥</div>

            <div class="dashboard-content">
                <h2>사용자 관리</h2>
                <p>
                    학생과 교사 등 사용자 정보를 관리합니다.
                </p>
            </div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-icon">📊</div>

            <div class="dashboard-content">
                <h2>서비스 현황</h2>
                <p>
                    학원 및 사용자 현황을 확인할 수 있습니다.
                </p>
            </div>
        </div>

    </section>

    <section class="account-area">

        <div class="account-header">
            <h2>계정 관리</h2>
            <p>
                계정 정보를 확인하거나 로그아웃 및 회원 탈퇴를 할 수 있습니다.
            </p>
        </div>

        <div class="account-buttons">

            <a th:href="@{/logout}" class="logout-button">
                로그아웃
            </a>

            <a th:href="@{/account}" class="logout-button">
                계정정보 조회
            </a>

            <form th:action="@{/user/withdraw}"
                  method="post"
                  onsubmit="return confirm('정말 탈퇴하시겠습니까? 데이터는 1년간 안전하게 보관된 후 완전히 삭제됩니다.');">

                <button type="submit" class="withdraw-button">
                    회원 탈퇴하기
                </button>

            </form>

        </div>

        <p class="withdraw-warning">
            회원 탈퇴 시 계정 사용이 중지되며,
            관련 데이터는 정책에 따라 보관 후 삭제됩니다.
        </p>

    </section>

</main>

</body>
</html>
