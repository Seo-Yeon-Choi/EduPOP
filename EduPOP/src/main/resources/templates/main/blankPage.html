<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 승인 대기</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/pending.css}">
</head>

<body class="entry-page pending-page">

<div th:replace="~{layout/header :: header}"></div>

<main class="entry-shell pending-container">

    <section class="entry-card pending-card">

        <a class="entry-brand pending-brand" th:href="@{/}">
            <span class="entry-brand-mark" aria-hidden="true">EP</span>
            <span>EduPOP</span>
        </a>

        <div class="pending-icon" aria-hidden="true">
            <span>···</span>
        </div>

        <p class="pending-label">
            APPROVAL PENDING
        </p>

        <h1>학원 승인을 기다리고 있어요</h1>

        <div th:if="${session.loginUser != null}" class="user-welcome">

            <h3>
                <span th:text="${session.loginUser.name}"></span>님, 환영합니다!
            </h3>

            <p>
                가입 정보가 안전하게 접수되었습니다.<br>
                관리자가 내용을 확인한 뒤 EduPOP 이용을 시작할 수 있어요.
            </p>

        </div>

        <div class="pending-info">

            <div class="info-item">
                <span class="info-title">현재 상태</span>
                <span class="entry-badge entry-badge-waiting status-badge">승인 대기</span>
            </div>

            <p class="pending-description">
                승인 완료 후 다시 로그인하면 학생 또는 선생님 공간으로 자동 이동합니다.
            </p>

        </div>

        <div class="account-buttons">

            <a href="/logout" class="logout-button">
                로그아웃
            </a>

            <form th:action="@{/user/withdraw}"
                  method="post"
                  onsubmit="return confirm('정말 탈퇴하시겠습니까? 데이터는 1년간 안전하게 보관된 후 완전히 삭제됩니다.');">

                <button type="submit" class="withdraw-button">
                    회원 탈퇴하기
                </button>

            </form>

        </div>

        <p class="withdraw-warning">
            회원 탈퇴 시 계정 사용이 중지되며 관련 데이터는 정책에 따라 보관 후 삭제됩니다.
        </p>

    </section>

</main>

</body>
</html>
