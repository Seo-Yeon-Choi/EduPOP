<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 승인 대기</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/pending.css}">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="pending-container">

    <section class="pending-card ui-card">

        <div class="pending-icon">
            ⏳
        </div>

        <p class="pending-label">
            APPROVAL PENDING
        </p>

        <h1>승인 대기 중입니다</h1>

        <div th:if="${session.loginUser != null}" class="user-welcome">

            <h3>
                <span th:text="${session.loginUser.name}"></span>님, 환영합니다!
            </h3>

            <p>
                회원가입이 완료되었습니다.<br>
                관리자의 승인이 완료되면 EduPOP 서비스를 이용할 수 있습니다.
            </p>

        </div>

        <div class="pending-info">

            <div class="info-item">
                <span class="info-title">현재 상태</span>
                <span class="status-badge">승인 대기</span>
            </div>

            <p class="pending-description">
                승인 완료 후 다시 로그인하면 사용자 역할에 맞는 페이지로 이동합니다.
            </p>

        </div>

        <div class="account-buttons">

            <a th:href="@{/logout}" class="logout-button ui-button ui-button-primary">
                로그아웃
            </a>

            <form th:action="@{/user/withdraw}"
                  method="post"
                  onsubmit="return confirm('정말 탈퇴하시겠습니까? 데이터는 1년간 안전하게 보관된 후 완전히 삭제됩니다.');">

                <button type="submit" class="withdraw-button ui-button ui-button-danger">
                    회원 탈퇴하기
                </button>

            </form>

        </div>

        <p class="withdraw-warning">
            회원 탈퇴 시 계정 사용이 중지되며 관련 데이터는 정책에 따라 보관 후 삭제됩니다.
        </p>

    </section>

</main>

</body>
</html>
