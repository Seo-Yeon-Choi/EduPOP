<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 관리자</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-main.css}">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<!--
<div th:replace="~{layout/sidebar-admin :: sidebar}"></div>
-->
<main class="admin-container">

    <div class="admin-page-header">
        <h1>관리자 페이지</h1>
        <p>학원 및 서비스 정보를 관리할 수 있습니다.</p>
    </div>

    <section class="admin-menu-grid">

        <a href="/register-page" class="admin-menu-card">

            <div class="menu-icon">
                🏫
            </div>

            <div class="menu-content">
                <h2>학원 등록</h2>
                <p>
                    새로운 학원 정보를 등록하고 관리합니다.
                </p>
            </div>

            <span class="menu-arrow">›</span>

        </a>

    </section>

    <div class="logout-area">
        <a href="/logout" class="logout-button">
            로그아웃
        </a>
    </div>

</main>

</body>
</html>
