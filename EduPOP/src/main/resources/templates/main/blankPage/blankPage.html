<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 후 메인 화면(초대링크 전)</title>
</head>
<h1>초대링크를 받아야 이용하실 수 있습니다</h1>
<body>
<div th:if="${session.loginUser != null}">
    <h3>🎉 <span th:text="${session.loginUser.kakaoName}"></span>님, 환영합니다! 🎉</h3>

    <!-- 🌟 로그아웃 길(/logout)로 안내하는 버튼 링크 -->
    <a href="/logout">
        <button style="background-color: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            로그아웃
        </button>
    </a>
</div>
</body>
</html>
