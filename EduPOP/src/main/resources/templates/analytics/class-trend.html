<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 수업 전 3분 보완 신호 대시보드</title>

    <link rel="stylesheet"
          as="style"
          crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/teacher-analytics.css}">
</head>

<body>

<th:block th:replace="~{layout/header :: header}"></th:block>
<th:block th:replace="~{layout/sidebar-teacher :: sidebar}"></th:block>

<div class="page-content-wrapper">

    <div class="class-list-card">

        <h3>📚 나의 클래스 룸</h3>

        <div id="classListContainer">

            <div th:if="${teacherClasses == null or teacherClasses.isEmpty()}"
                 class="class-empty">
                등록된 반이 없습니다.
            </div>

            <div th:each="cls, iter : ${teacherClasses}"
                 class="class-item"
                 th:classappend="${iter.first} ? 'active'"
                 th:data-class-id="${cls.classId}"
                 th:data-class-name="${cls.name}"
                 onclick="onClassItemClick(this)">

                <span th:text="${cls.name}">
                    반 이름
                </span>

                <span class="signal-badge signal-green">
                    🟢 현황 확인
                </span>

            </div>

        </div>

    </div>

    <div class="analytics-main">

        <div class="analytics-card">

            <div class="analytics-header">

                <div>

                    <div class="back-button-wrapper">

                        <button class="back-button"
                                onclick="location.href='/exam/list'">
                            <span>⬅️ 반 관리(OMR)로 이동</span>
                        </button>

                    </div>

                    <h2 id="selectedClassName"
                        class="selected-class-name">
                        클래스 선택
                    </h2>

                    <p class="analytics-subtitle">
                        [수업 전 3분 보완 브리핑 뷰]
                    </p>

                </div>

                <div id="signalBadgeContainer"
                     class="signal-badge-container">

                    <button class="signal-action-btn parent-report-btn"
                            onclick="copyClassReportLink()">

                        <span>🔗 학부모 리포트 배포</span>

                        <span class="parent-report-hint">
                            단톡방 공유용
                        </span>

                    </button>

                    <button id="classSignalBtn"
                            class="signal-action-btn signal-green"
                            onclick="openDrawer()">

                        <span>🟢 안정권</span>

                        <span class="signal-btn-hint">
                            👉 학생별 리포트 보기
                        </span>

                    </button>

                </div>

            </div>

            <div id="warningReasonText"
                 class="warning-reason warning-green">
                클래스별 종합 성취도 분석 리포트를 분석 중입니다...
            </div>

        </div>

        <div class="analytics-card">

            <h3>
                📈 최근 응시 시험 성취도 비교 (우리 반 vs 전체 평균)
            </h3>

            <div id="examComparisonArea"
                 class="exam-comparison-area">
                응시 내역이 있는 시험의 성취도 비교 그래프를 불러오는 중입니다.
            </div>

        </div>

    </div>

</div>

<div id="drawerOverlay"
     class="drawer-overlay"
     onclick="closeDrawer()">
</div>

<div id="drawerPanel"
     class="drawer-panel">

    <div class="drawer-header">

        <h3 class="drawer-title">
            🎯 학생별 맞춤 리포트 & 과제 큐레이션
        </h3>

        <button class="drawer-close-btn"
                onclick="closeDrawer()">
            ✕
        </button>

    </div>

    <div id="vulnerableStudentList"
         class="vulnerable-student-list">

        <p class="drawer-loading">
            학생 데이터를 분석 중입니다...
        </p>

    </div>

</div>

<script>

    function onClassItemClick(element) {

        document.querySelectorAll('.class-item')
            .forEach(el => el.classList.remove('active'));

        element.classList.add('active');

        const classId = element.getAttribute('data-class-id');
        const className = element.getAttribute('data-class-name');

        document.getElementById('selectedClassName').innerText = className;

        fetch(`/analytics/api/class/${classId}/warning-signal`)
            .then(res => res.json())
            .then(data => {

                const reasonDiv = document.getElementById('warningReasonText');
                const signalBtn = document.getElementById('classSignalBtn');

                reasonDiv.innerText = data.warningReason;

                signalBtn.className = "signal-action-btn";
                reasonDiv.className = "warning-reason";

                const leftBadge = element.querySelector('.signal-badge');
                leftBadge.className = "signal-badge";

                if (data.warningLevel === "RED") {

                    signalBtn.classList.add("signal-red");
                    reasonDiv.classList.add("warning-red");
                    leftBadge.classList.add("signal-red");

                    signalBtn.innerHTML = `
                        <span>🔴 우선 보완 필요 (위험)</span>
                        <span class="signal-btn-hint">
                            👉 취약 학생 보기
                        </span>
                    `;

                    leftBadge.innerText = "🔴 위험";

                } else if (data.warningLevel === "YELLOW") {

                    signalBtn.classList.add("signal-yellow");
                    reasonDiv.classList.add("warning-yellow");
                    leftBadge.classList.add("signal-yellow");

                    signalBtn.innerHTML = `
                        <span>🟡 확인 필요 (주의)</span>
                        <span class="signal-btn-hint">
                            👉 점검 학생 보기
                        </span>
                    `;

                    leftBadge.innerText = "🟡 주의";

                } else {

                    signalBtn.classList.add("signal-green");
                    reasonDiv.classList.add("warning-green");
                    leftBadge.classList.add("signal-green");

                    signalBtn.innerHTML = `
                        <span>🟢 안정 성취 (안정)</span>
                        <span class="signal-btn-hint">
                            👉 학생별 리포트 보기
                        </span>
                    `;

                    leftBadge.innerText = "🟢 안정";
                }

                let examHtml = '';

                if (data.examComparisons &&
                    data.examComparisons.length > 0) {

                    examHtml = '<div class="exam-list">';

                    data.examComparisons.forEach(exam => {

                        const classScore =
                            exam.classAverageScore !== null &&
                            exam.classAverageScore !== undefined
                                ? exam.classAverageScore
                                : 0;

                        const totalScore =
                            exam.totalAverageScore !== null &&
                            exam.totalAverageScore !== undefined
                                ? exam.totalAverageScore
                                : 0;

                        const examDate =
                            exam.examDate !== null &&
                            exam.examDate !== undefined &&
                            exam.examDate !== ''
                                ? exam.examDate
                                : '날짜 미지정';

                        examHtml += `
                            <div class="exam-result-card">

                                <div class="exam-result-header">

                                    <span>
                                        ${exam.examTitle}

                                        <span class="exam-date">
                                            (응시일: ${examDate})
                                        </span>
                                    </span>

                                    <span class="exam-score">

                                        우리 반:
                                        <b class="class-average-score">
                                            ${classScore}점
                                        </b>

                                        |

                                        전체 평균:
                                        <span class="total-average-score">
                                            ${totalScore}점
                                        </span>

                                    </span>

                                </div>

                                <div class="score-bars">

                                    <div class="score-row">

                                        <span class="score-label">
                                            우리 반
                                        </span>

                                        <div class="score-track">

                                            <div
                                                class="score-fill class-score-fill"
                                                data-score="${Math.min(classScore, 100)}">
                                            </div>

                                        </div>

                                    </div>

                                    <div class="score-row">

                                        <span class="score-label">
                                            전체 평균
                                        </span>

                                        <div class="score-track">

                                            <div
                                                class="score-fill total-score-fill"
                                                data-score="${Math.min(totalScore, 100)}">
                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </div>
                        `;
                    });

                    examHtml += '</div>';

                } else {

                    examHtml = `
                        <p class="exam-empty">
                            이 클래스에서 응시 완료한 시험 내역이 없습니다.
                        </p>
                    `;
                }

                const examArea =
                    document.getElementById('examComparisonArea');

                examArea.innerHTML = examHtml;

                examArea.querySelectorAll('.score-fill')
                    .forEach(bar => {

                        const score = bar.getAttribute('data-score');

                        bar.style.width = `${score}%`;
                    });

                let studentHtml = '';

                if (data.vulnerableStudents &&
                    data.vulnerableStudents.length > 0) {

                    data.vulnerableStudents.forEach(st => {

                        const weakTypes =
                            st.topWeakTypes &&
                            st.topWeakTypes.length > 0
                                ? st.topWeakTypes.join(', ')
                                : '특이사항 없음';

                        const errorRate =
                            st.errorRate !== null
                                ? st.errorRate
                                : 0.0;

                        let statusBadge = `
                            <span class="
                                student-status-badge
                                student-status-green
                            ">
                                🟢 안정권
                            </span>
                        `;

                        if (errorRate >= 70.0) {

                            statusBadge = `
                                <span class="
                                    student-status-badge
                                    student-status-red
                                ">
                                    🔴 우선 보완 필요
                                </span>
                            `;

                        } else if (errorRate >= 40.0) {

                            statusBadge = `
                                <span class="
                                    student-status-badge
                                    student-status-yellow
                                ">
                                    🟡 확인 필요
                                </span>
                            `;
                        }

                        studentHtml += `
                            <div class="student-report-card">

                                <div class="student-report-header">

                                    ${statusBadge}

                                    <span class="student-error-rate">
                                        개인 오답률: ${errorRate}%
                                    </span>

                                </div>

                                <div class="student-name">
                                    ${st.studentName}
                                </div>

                                <div class="student-weak-info">

                                    • 취약 유형 태그:

                                    <b class="student-weak-type">
                                        ${weakTypes}
                                    </b>

                                    <br>

                                </div>

                            </div>
                        `;
                    });

                } else {

                    studentHtml = `
                        <p class="student-empty">
                            현재 집중 보완이 필요한 학생이 없습니다.
                            모두 훌륭합니다! 🟢
                        </p>
                    `;
                }

                document.getElementById('vulnerableStudentList')
                    .innerHTML = studentHtml;

            })
            .catch(err =>
                console.error('데이터 로드 실패:', err)
            );
    }

    function openDrawer() {

        document.getElementById('drawerOverlay')
            .classList.add('open');

        document.getElementById('drawerPanel')
            .classList.add('open');
    }

    function closeDrawer() {

        document.getElementById('drawerOverlay')
            .classList.remove('open');

        document.getElementById('drawerPanel')
            .classList.remove('open');
    }

    function copyClassReportLink() {

        const activeClassItem =
            document.querySelector('.class-item.active');

        if (!activeClassItem) {

            alert(
                "선택된 반이 없습니다. 반을 먼저 선택해 주세요."
            );

            return;
        }

        const classId =
            activeClassItem.getAttribute('data-class-id');

        const className =
            activeClassItem.getAttribute('data-class-name');

        const reportAuthUrl =
            window.location.origin +
            `/share/reports/auth?classId=${classId}`;

        navigator.clipboard
            .writeText(reportAuthUrl)
            .then(() => {

                alert(
                    `✅ [${className}] 학부모 리포트 접속 링크가 복사되었습니다!\n` +
                    `학부모님들이 모인 카카오톡 단톡방 등에 붙여넣기 해주세요.\n\n` +
                    `복사된 주소: ${reportAuthUrl}`
                );

            })
            .catch(err => {

                console.error('복사 실패:', err);

                alert(
                    "❌ 링크 복사에 실패했습니다. " +
                    "브라우저의 클립보드 권한을 확인해주세요."
                );
            });
    }

    function loadAllClassStatuses() {

        const classItems =
            document.querySelectorAll('.class-item');

        classItems.forEach(item => {

            const classId =
                item.getAttribute('data-class-id');

            const badgeSpan =
                item.querySelector('.signal-badge');

            fetch(`/analytics/api/class/${classId}/warning-signal`)
                .then(res => res.json())
                .then(data => {

                    badgeSpan.className = "signal-badge";

                    if (data.warningLevel === "RED") {

                        badgeSpan.classList.add("signal-red");
                        badgeSpan.innerText = "🔴 위험";

                    } else if (
                        data.warningLevel === "YELLOW"
                    ) {

                        badgeSpan.classList.add("signal-yellow");
                        badgeSpan.innerText = "🟡 주의";

                    } else {

                        badgeSpan.classList.add("signal-green");
                        badgeSpan.innerText = "🟢 안정";
                    }
                })
                .catch(err =>
                    console.error(
                        '반 상태 로드 실패:',
                        err
                    )
                );
        });
    }

    document.addEventListener(
        'DOMContentLoaded',
        function () {

            loadAllClassStatuses();

            const firstItem =
                document.querySelector('.class-item');

            if (firstItem) {
                onClassItemClick(firstItem);
            }
        }
    );

</script>

</body>
</html>
