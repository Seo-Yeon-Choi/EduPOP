<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 월간 학부모 리포트</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/parent-report-auth.css}">
</head>

<body>

<main class="auth-page">

    <div class="verify-container">

        <h1 class="verify-title">
            📖 월간 학부모 리포트
        </h1>

        <p class="verify-description">
            우리 아이의 맞춤형 학습 리포트를 확인하기 위해<br>
            학생 정보를 입력해 주세요.
        </p>

        <div th:if="${error}"
             class="error-message"
             th:text="${error}">
        </div>

        <form th:action="@{/share/reports/auth/verify}"
              method="post"
              class="verify-form">

            <input type="hidden"
                   name="classId"
                   th:value="${classId}">

            <div class="form-group">

                <label for="studentName"
                       class="input-label">
                    학생 이름
                </label>

                <input type="text"
                       id="studentName"
                       name="studentName"
                       class="input-field"
                       placeholder="예: 박시은"
                       autocomplete="off"
                       required>

            </div>

            <div class="form-group">

                <label for="phoneLast4"
                       class="input-label">
                    학생 전화번호 뒤 4자리
                </label>

                <input type="password"
                       id="phoneLast4"
                       name="phoneLast4"
                       class="input-field"
                       placeholder="예: 2222"
                       maxlength="4"
                       inputmode="numeric"
                       autocomplete="off"
                       required>

            </div>

            <button type="submit"
                    class="btn-submit">
                리포트 확인하기
            </button>

        </form>

    </div>

</main>

</body>
</html>
