<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${exam.title}">
        시험 응시
    </title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/student-exam-take.css}">

</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="exam-take-container">

    <header class="exam-header">

        <div>

            <h1 th:text="${exam.title}">
                시험 제목
            </h1>

            <p th:if="${mode == 'REVIEW'}">
                이전 시험에서 틀린 문제를 다시 풀어보세요.
            </p>

            <p th:if="${exam.examType == T(com.example.EduPOP.domain.exam.ExamType).WORD}">
                제한 시간은 15분 입니다.
            </p>

            <!-- 단어시험에서만 표시 -->
            <div th:if="${exam.examType == T(com.example.EduPOP.domain.exam.ExamType).WORD}"
                 id="examTimer"
                 class="exam-timer">

                <span class="timer-label">남은 시간</span>

                <strong id="timerDisplay">
                    15:00
                </strong>

            </div>
        </div>

    </header>

    <input type="hidden"
           id="attemptId"
           th:value="${attempt.attemptId}">
    <input type="hidden"
           id="wordExam"
           th:value="${exam.examType == T(com.example.EduPOP.domain.exam.ExamType).WORD}">
    <section class="question-list">

        <article class="question-card"
                 th:each="question : ${questions}"
                 th:data-question-id="${question.questionId}">

            <div class="question-number">
                <span th:text="${question.questionNumber}">1</span>.
            </div>

            <div th:if="${question.passage != null
                         and !question.passage.isEmpty()}"
                 class="question-passage"
                 th:text="${question.passage}">
            </div>

            <div class="question-text"
                 th:text="${question.questionText}">
            </div>

            <!-- 객관식 -->
            <div th:if="${question.questionType == T(com.example.EduPOP.domain.exam.QuestionType).MULTIPLE_CHOICE}"
                 class="choice-list">

                <label th:each="choice : ${question.choices}"
                       class="choice-item">

                    <input type="radio"
                           th:name="'question-' + ${question.questionId}"
                           th:value="${choice.choiceNumber}">

                    <span th:text="${choice.choiceNumber}">
                        1
                    </span>.

                    <span th:text="${choice.choiceText}">
                        선지
                    </span>

                </label>

            </div>
            <!-- 주관식 -->
            <div th:if="${question.questionType == T(com.example.EduPOP.domain.exam.QuestionType).SHORT_ANSWER}"
                 class="short-answer">

                <input type="text"
                       class="student-answer"
                       placeholder="정답을 입력하세요">

            </div>

        </article>

    </section>

    <div class="submit-area">

        <button type="button"
                id="submitExamButton">

            제출하기

        </button>

    </div>

</main>

<script th:src="@{/js/student-exam.js}"></script>

</body>
</html>
