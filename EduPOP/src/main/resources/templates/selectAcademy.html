<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>카카오 유저 학원 선택</title>
</head>
<body>
<form th:action="@{/selectAcademy}" method="post">

    <div>
        <label>이메일</label>
        <input type="email"
               name="email"
               th:value="${loginUser.email}"
               required>
    </div>

    <div>
        <label>전화번호</label>
        <input type="text"
               name="phone"
               th:value="${loginUser.phone}"
               required>
    </div>

    <div>
        <label>학년</label>
        <select name="schoolGrade" required>
            <option value="">학년을 선택하세요</option>
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
            <option value="4">4학년</option>
            <option value="5">5학년</option>
            <option value="6">6학년</option>
        </select>
    </div>

    <div>
        <label>학원</label>
        <select name="academyId" required>
            <option value="">학원을 선택하세요</option>

            <option th:each="academy : ${academies}"
                    th:value="${academy.academyId}"
                    th:text="${academy.name}">
            </option>
        </select>
    </div>


    <button type="submit">선택 완료</button>

</form>
</body>
</html>
