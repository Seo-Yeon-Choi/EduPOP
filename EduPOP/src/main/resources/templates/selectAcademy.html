<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 학원 선택</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/kakao-academy.css}">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="academy-select-container">

    <section class="academy-select-card">

        <div class="academy-select-header">
            <h1>추가 정보 입력</h1>
            <p>EduPOP 이용을 위해 정보를 입력하고 학원을 선택해주세요.</p>
        </div>

        <form th:action="@{/selectAcademy}"
              method="post"
              class="academy-select-form">

            <div class="form-group">
                <label for="email">이메일</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        th:value="${loginUser.email}"
                        placeholder="이메일을 입력해주세요."
                        required>
            </div>

            <div class="form-group">
                <label for="phone">전화번호</label>

                <input
                        type="text"
                        id="phone"
                        name="phone"
                        th:value="${loginUser.phone}"
                        placeholder="010-0000-0000"
                        required>
            </div>

            <div class="form-group">
                <label for="schoolGrade">학년</label>

                <select
                        id="schoolGrade"
                        name="schoolGrade"
                        required>

                    <option value="">학년을 선택하세요</option>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                    <option value="4">4학년</option>
                    <option value="5">5학년</option>
                    <option value="6">6학년</option>

                </select>
            </div>

            <div class="form-group">
                <label for="academyId">학원</label>

                <select
                        id="academyId"
                        name="academyId"
                        required>

                    <option value="">학원을 선택하세요</option>

                    <option
                            th:each="academy : ${academies}"
                            th:value="${academy.academyId}"
                            th:text="${academy.name}">
                    </option>

                </select>
            </div>

            <button type="submit" class="submit-button">
                선택 완료
            </button>

        </form>

    </section>

</main>

</body>
</html>
