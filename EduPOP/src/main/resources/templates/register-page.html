<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPOP - 학원 등록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-theme.css}">
</head>
<body class="admin-onboarding">

<main class="admin-onboarding-shell">
    <a class="onboarding-brand" th:href="@{/}">
        <span class="admin-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2 2 7l10 5 10-5-10-5Z"></path>
                <path d="m2 12 10 5 10-5"></path><path d="m2 17 10 5 10-5"></path>
            </svg>
        </span>
        EduPOP 관리자
    </a>

    <section class="onboarding-card">
        <header class="onboarding-card-header">
            <div>
                <span class="admin-eyebrow">Academy Setup</span>
                <h1>학원 정보를 등록해주세요</h1>
                <p>EduPOP 운영을 시작하기 위한 기본 정보입니다.<br>사업자 정보 확인 후 관리자 공간이 열립니다.</p>
            </div>
            <span class="onboarding-header-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18"></path><path d="M5 21V7l7-4 7 4v14"></path>
                    <path d="M9 21v-6h6v6"></path><path d="M9 9h.01"></path><path d="M15 9h.01"></path>
                </svg>
            </span>
        </header>

        <form class="onboarding-form" id="academyForm" th:action="@{/academy/register}"
              method="post" onsubmit="return checkForm()">
            <div class="admin-message admin-message-error" th:if="${error}" th:text="${error}">
                입력 내용을 확인해주세요.
            </div>

            <section class="admin-form-section" style="padding-right:0;padding-left:0;">
                <h2 class="form-section-title">
                    <span class="admin-section-number">1</span>
                    기본 정보
                </h2>
                <div class="admin-form-grid">
                    <div class="admin-form-field full-width">
                        <label for="name">학원 이름 <span class="required-mark">*</span></label>
                        <input class="admin-input" id="name" name="name" type="text"
                               placeholder="예: 한국정보교육원" autocomplete="organization" required>
                    </div>
                    <div class="admin-form-field">
                        <label for="representativeName">대표자명 <span class="required-mark">*</span></label>
                        <input class="admin-input" id="representativeName" name="representativeName" type="text"
                               placeholder="예: 홍길동" required>
                    </div>
                    <div class="admin-form-field">
                        <label for="phone">학원 연락처 <span class="required-mark">*</span></label>
                        <input class="admin-input" id="phone" name="phone" type="text"
                               placeholder="예: 02-1234-5678" autocomplete="tel" required>
                    </div>
                </div>
            </section>

            <section class="admin-form-section" style="padding-right:0;padding-left:0;">
                <h2 class="form-section-title">
                    <span class="admin-section-number" style="background:var(--admin-green);">2</span>
                    주소
                </h2>
                <div class="admin-form-field">
                    <label for="address">학원 주소 <span class="required-mark">*</span></label>
                    <input class="admin-input" id="address" name="address" type="text"
                           placeholder="예: 서울시 관악구 봉천로" autocomplete="street-address" required>
                </div>
            </section>

            <section class="admin-form-section" style="padding-right:0;padding-left:0;border-bottom:0;">
                <h2 class="form-section-title">
                    <span class="admin-section-number" style="background:var(--admin-purple);">3</span>
                    사업자 정보
                </h2>
                <div class="admin-form-grid">
                    <div class="admin-form-field">
                        <label for="businessNumber">사업자등록번호 <span class="required-mark">*</span></label>
                        <input class="admin-input" id="businessNumber" name="businessNumber" type="text"
                               placeholder="예: 123-45-67890" maxlength="12" inputmode="numeric" required>
                    </div>
                    <div class="admin-form-field">
                        <label for="businessStartDate">개업일자 <span class="required-mark">*</span></label>
                        <input class="admin-input" id="businessStartDate" name="businessStartDate" type="date" required>
                    </div>
                </div>
            </section>

            <div class="onboarding-note">
                입력한 사업자등록정보는 국세청 API의 진위확인에 사용됩니다. 사업자등록증의 대표자명과 개업일자를 정확히 입력해주세요.
            </div>

            <button class="ui-button ui-button-primary" type="submit" style="width:100%;min-height:46px;">
                사업자 정보 확인 후 등록
            </button>
        </form>
    </section>
</main>

<script>
    function checkForm() {
        const requiredIds = ['name', 'representativeName', 'phone', 'address', 'businessNumber', 'businessStartDate'];
        for (const id of requiredIds) {
            const field = document.getElementById(id);
            if (!field.value.trim()) {
                field.reportValidity();
                field.focus();
                return false;
            }
        }
        return true;
    }

    document.getElementById('businessNumber').addEventListener('input', function () {
        let value = this.value.replace(/[^0-9]/g, '').substring(0, 10);
        if (value.length > 5) {
            value = `${value.substring(0, 3)}-${value.substring(3, 5)}-${value.substring(5)}`;
        } else if (value.length > 3) {
            value = `${value.substring(0, 3)}-${value.substring(3)}`;
        }
        this.value = value;
    });
</script>
</body>
</html>
