<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학원 등록하기</title>

    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h2>🏫 우리 학원 등록하기</h2>

    <form action="/academy/register"
          method="POST"
          id="academyForm"
          onsubmit="return checkForm()">

        <div class="form-group">
            <label for="name">학원 이름</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="예: 한국정보교육원">
        </div>

        <div class="form-group">
            <label for="address">학원 주소</label>
            <input type="text"
                   id="address"
                   name="address"
                   placeholder="예: 서울시 관악구 봉천로">
        </div>

        <div class="form-group">
            <label for="phone">연락처</label>
            <input type="text"
                   id="phone"
                   name="phone"
                   placeholder="예: 02-1234-5678">
        </div>

        <div class="form-group">
            <label for="businessCer">사업자 등록번호</label>
            <input type="text"
                   id="businessCer"
                   name="businessCer"
                   placeholder="예: 123-45-67890">
        </div>

        <button type="submit" class="submit-btn">
            등록하기
        </button>

    </form>

</div>

<script>

    // 빈칸이 있는지 검사
    function checkForm() {

        const name = document.getElementById('name').value;
        const address = document.getElementById('address').value;
        const phone = document.getElementById('phone').value;
        const businessCer =
            document.getElementById('businessCer').value;

        if (name.trim() === '') {
            alert('학원 이름을 입력해 주세요!');
            return false;
        }

        if (address.trim() === '') {
            alert('학원 주소를 입력해 주세요!');
            return false;
        }

        if (phone.trim() === '') {
            alert('전화번호를 입력해 주세요!');
            return false;
        }

        if (businessCer.trim() === '') {
            alert('사업자 등록번호를 입력해 주세요!');
            return false;
        }

        return true;
    }

</script>

</body>
</html>
