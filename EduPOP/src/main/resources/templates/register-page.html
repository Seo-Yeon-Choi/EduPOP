<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 학원 등록</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/academy-register.css}">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="academy-register-page">

    <div class="register-container">

        <div class="register-header">
            <div class="register-icon">🏫</div>

            <h1>학원 등록</h1>

            <p>
                EduPOP을 시작하기 위해<br>
                운영하시는 학원 정보를 등록해 주세요.
            </p>
        </div>

        <form action="/academy/register"
              method="POST"
              id="academyForm"
              class="register-form"
              onsubmit="return checkForm()">

            <div class="form-group">
                <label for="name">
                    학원 이름
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="예: 한국정보교육원"
                       autocomplete="organization">
            </div>

            <div class="form-group">
                <label for="address">
                    학원 주소
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="address"
                       name="address"
                       placeholder="예: 서울시 관악구 봉천로"
                       autocomplete="street-address">
            </div>

            <div class="form-group">
                <label for="phone">
                    학원 연락처
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="phone"
                       name="phone"
                       placeholder="예: 02-1234-5678"
                       autocomplete="tel">
            </div>
            <div class="form-group">

                <label for="representativeName">
                    대표자명
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="representativeName"
                       name="representativeName"
                       placeholder="예: 홍길동">

            </div>

            <div class="form-group">

                <label for="businessStartDate">
                    개업일자
                    <span class="required">*</span>
                </label>

                <input type="date"
                       id="businessStartDate"
                       name="businessStartDate">

            </div>

            <div class="form-group">

                <label for="businessNumber">
                    사업자등록번호
                    <span class="required">*</span>
                </label>

                <input type="text"
                       id="businessNumber"
                       name="businessNumber"
                       placeholder="예: 123-45-67890"
                       maxlength="12">

            </div>

            <div th:if="${error}"
                 class="error-message"
                 th:text="${error}">
            </div>

            <div class="form-notice">
                <span class="notice-icon">ⓘ</span>

                <p>
                    등록된 학원 정보는 관리자 승인 및
                    교사·학생 회원의 소속 학원 확인에 사용됩니다.
                </p>
            </div>

            <button type="submit"
                    class="submit-btn">
                학원 등록하기
            </button>

        </form>

    </div>

</main>

<script>
    function checkForm() {

        const name =
            document.getElementById('name').value.trim();

        const address =
            document.getElementById('address').value.trim();

        const phone =
            document.getElementById('phone').value.trim();

        const businessNumber =
            document.getElementById('businessNumber').value.trim();

        if (name === '') {
            alert('학원 이름을 입력해 주세요.');
            document.getElementById('name').focus();
            return false;
        }

        if (address === '') {
            alert('학원 주소를 입력해 주세요.');
            document.getElementById('address').focus();
            return false;
        }

        if (phone === '') {
            alert('전화번호를 입력해 주세요.');
            document.getElementById('phone').focus();
            return false;
        }

        if (businessNumber === '') {
            alert('사업자 등록번호를 입력해 주세요.');
            document.getElementById('businessNumber').focus();
            return false;
        }

        return true;
    }

    document
        .getElementById('businessNumber')
        .addEventListener('input', function () {

            let value = this.value.replace(/[^0-9]/g, '');

            if (value.length > 10) {
                value = value.substring(0, 10);
            }

            if (value.length > 5) {
                value =
                    value.substring(0, 3)
                    + '-'
                    + value.substring(3, 5)
                    + '-'
                    + value.substring(5);
            } else if (value.length > 3) {
                value =
                    value.substring(0, 3)
                    + '-'
                    + value.substring(3);
            }

            this.value = value;
        });
</script>

</body>
</html>
