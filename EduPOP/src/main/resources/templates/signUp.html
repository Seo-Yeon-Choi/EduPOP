<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 회원가입</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="signup-container">

    <section class="signup-card">

        <div class="signup-header">
            <h1>회원가입</h1>
            <p>EduPOP 이용을 위한 정보를 입력해주세요.</p>
        </div>

        <form th:action="@{/signUp}"
              method="post"
              class="signup-form">

            <div class="form-group">
                <label for="loginId">아이디</label>
                <input
                        type="text"
                        id="loginId"
                        name="loginId"
                        placeholder="아이디를 입력해주세요."
                        required>
            </div>

            <div class="form-group">
                <label for="passwordHash">비밀번호</label>
                <input
                        type="password"
                        id="passwordHash"
                        name="passwordHash"
                        placeholder="비밀번호를 입력해주세요."
                        required>
            </div>

            <div class="form-group">
                <label for="name">이름</label>
                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="이름을 입력해주세요."
                        required>
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="phone">전화번호</label>
                <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="010-0000-0000">
            </div>

            <div class="form-group">
                <label for="schoolGrade">학년</label>
                <input
                        type="text"
                        id="schoolGrade"
                        name="schoolGrade"
                        placeholder="예: 중학교 2학년">
            </div>

            <!-- 관리자 회원가입에서는 표시하지 않음 -->
            <div class="form-group"
                 th:if="${requestedRole != 'ADMIN'}">

                <label for="academyId">학원 선택</label>

                <select
                        id="academyId"
                        name="academyId"
                        required>

                    <option value="">학원을 선택하세요</option>

                    <option
                            th:each="academy : ${academies}"
                            th:value="${academy.academyId}"
                            th:text="${academy.name}">
                    </option>

                </select>
            </div>

            <button type="submit" class="signup-button">
                가입하기
            </button>

        </form>

        <div class="login-area">
            <span>이미 계정이 있으신가요?</span>

            <a th:href="@{/}" class="login-link">
                로그인하기
            </a>
        </div>

    </section>

</main>

<script th:if="${error != null}">
    alert("[[${error}]]");
</script>

</body>
</html>
