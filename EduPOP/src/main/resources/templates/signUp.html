<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<form th:action="@{/signUp}" method="post">

    <!-- 입력란 -->
    <input type="text" name="loginId" placeholder="아이디" required>
    <input type="text" name="passwordHash" placeholder="비밀번호" required>
    <input type="text" name="name" placeholder="이름" required>
    <input type="text" name="email" placeholder="이메일">
    <input type="text" name="phone" placeholder="전화번호">
    <input type="text" name="schoolGrade" placeholder="학년">

    <!-- 관리자가 아닐 경우만 보임 -->
    <div th:if="${requestedRole !='ADMIN'}">
        <label>학원 선택</label>
        <select name="academyId" required>
            <option value="">학원을 선택하세요</option>
            <option th:each="academy : ${academies}"
                    th:value="${academy.academyId}"
                    th:text="${academy.name}">
            </option>
        </select>
    </div>

    <div>
        <button type="submit">가입하기</button>
    </div>

</form>

<a href="/">
    <button style="padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">
        로그인하기
    </button>
</a>

<script th:if="${error != null}">
    alert("[[${error}]]");
</script>

</body>
</html>
