<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 학부모 리포트</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/parent-report.css}">
</head>

<body>

<main class="main-content">

    <header class="report-header">
        <h1 class="page-title">학부모 리포트</h1>
        <p class="page-desc">
            우리 아이의 성장을 한눈에 확인하세요.
        </p>
    </header>

    <!-- 학생 / 담당 교사 / 평가 기간 -->
    <section class="info-bar">

        <div class="info-dropdown">
            <span>👦</span>

            <span th:text="${report.studentName} + ' (' + ${report.gradeInfo} + ')'">
                학생 이름
            </span>

            <span class="info-divider">|</span>

            <span>👨‍🏫</span>

            <span th:text="${report.teacherName} + ' 선생님'">
                선생님 이름
            </span>
        </div>

        <div class="info-dropdown">
            <span>📅</span>

            <span th:text="${#temporals.format(report.periodStart, 'yyyy년 M월 d일')}
                + ' ~ '
                + ${#temporals.format(report.periodEnd, 'yyyy년 M월 d일')}">
                날짜
            </span>
        </div>

    </section>

    <!-- 상단 지표 카드 -->
    <section class="grid-container">

        <!-- 성과 지표 -->
        <article class="card">
            <h2 class="card-title">1. 성과 지표</h2>

            <div class="score-box-wrap">

                <div class="score-box">
                    <div class="score-label">
                        이번 달 월말평가 점수
                    </div>

                    <div class="score-value-row">
                        <span class="score-value"
                              th:text="${report.monthlyExamScore}">
                            0
                        </span>

                        <span class="score-unit">
                            점
                        </span>
                    </div>

                    <div class="score-avg"
                         th:text="'반 평균: ' + ${report.classAverageScore} + ' 점'">
                        반 평균: 0 점
                    </div>
                </div>

                <div class="score-box score-box-comprehension">

                    <div class="score-label">
                        학습 이해도
                    </div>

                    <div class="comprehension-value"
                         th:text="${report.comprehensionLevel}">
                        -
                    </div>

                    <div class="score-avg">
                        성취도 등급
                    </div>

                </div>

            </div>
        </article>

        <!-- 영역별 성취도 -->
        <article class="card">
            <h2 class="card-title">
                2. 영역별 성취도
            </h2>

            <div class="radar-chart-container">
                <canvas id="parentRadarChart"></canvas>
            </div>
        </article>

        <!-- 학습 태도 -->
        <article class="card">
            <h2 class="card-title">
                3. 학습 태도 및 달성 지표
            </h2>

            <div class="attitude-list">

                <div class="attitude-item">
                    <div class="attitude-label">
                        <span class="attitude-icon icon-word">📝</span>
                        단어 시험 응시율
                    </div>

                    <div class="attitude-val"
                         th:text="${report.wordExamCompletionRate} + ' %'">
                        0 %
                    </div>
                </div>

                <div class="attitude-item">
                    <div class="attitude-label">
                        <span class="attitude-icon icon-book">📖</span>
                        완독 도서 권수
                    </div>

                    <div class="attitude-val"
                         th:text="${report.booksReadCount} + ' 권'">
                        0 권
                    </div>
                </div>

                <div class="attitude-item">
                    <div class="attitude-label">
                        <span class="attitude-icon icon-review">🎯</span>
                        오답 노트 극복 문제 수
                    </div>

                    <div class="attitude-val"
                         th:text="${report.overcomeWrongCount} + ' 개'">
                        0 개
                    </div>
                </div>

                <div class="attitude-item">
                    <div class="attitude-label">
                        <span class="attitude-icon icon-weak">⚠️</span>
                        최다 오답 취약 유형
                    </div>

                    <div class="attitude-val"
                         th:text="${report.topWeakTypeTag}">
                        분석 중
                    </div>
                </div>

            </div>
        </article>

        <!-- 교사 평가 -->
        <article class="card">
            <h2 class="card-title">
                4. 서술형 평가
            </h2>

            <p class="comment-label">
                선생님 코멘트
            </p>

            <div class="teacher-comment">
                <span class="quote-icon">❝</span>

                <span th:text="${report.teacherComment}">
                    선생님 코멘트가 이곳에 출력됩니다.
                </span>
            </div>
        </article>

    </section>

    <!-- 점수 추이 -->
    <section class="chart-card">

        <div class="chart-header">

            <h2 class="card-title chart-title">
                5. 월말평가 점수 추이
            </h2>

            <div class="chart-navigation">

                <button type="button"
                        id="btnPrevChart"
                        class="btn-chart-nav">
                    ◀ 이전 1년
                </button>

                <span id="chartPageInfo"
                      class="chart-page-info">
                    1 / 2
                </span>

                <button type="button"
                        id="btnNextChart"
                        class="btn-chart-nav">
                    다음 1년 ▶
                </button>

            </div>

        </div>

        <div class="line-chart-container">
            <canvas id="scoreTrendChart"></canvas>
        </div>

    </section>

</main>


<script th:inline="javascript">

    const radarStats =
        /*[[${radarStats}]]*/ [];


    const radarLabels =
        radarStats.map(function (stat) {
            return stat.tag || '기타';
        });


    const studentRadarScores =
        radarStats.map(function (stat) {

            return stat.studentScoreRate != null
                ? stat.studentScoreRate
                : 0;
        });


    const classRadarScores =
        radarStats.map(function (stat) {

            return stat.classAvgScoreRate != null
                ? stat.classAvgScoreRate
                : 0;
        });


    const radarCanvas =
        document.getElementById(
            'parentRadarChart'
        );


    if (
        radarCanvas &&
        radarLabels.length > 0
    ) {

        new Chart(
            radarCanvas.getContext('2d'),
            {
                type: 'radar',

                data: {
                    labels: radarLabels,

                    datasets: [
                        {
                            label: '학생 성취도',

                            data:
                            studentRadarScores,

                            backgroundColor:
                                'rgba(236, 72, 153, 0.20)',

                            borderColor:
                                '#ec4899',

                            pointBackgroundColor:
                                '#ec4899',

                            borderWidth: 2,

                            pointRadius: 3,

                            fill: true
                        },

                        {
                            label: '반 평균',

                            data:
                            classRadarScores,

                            backgroundColor:
                                'rgba(148, 163, 184, 0.10)',

                            borderColor:
                                '#94a3b8',

                            pointBackgroundColor:
                                '#94a3b8',

                            borderWidth: 2,

                            pointRadius: 3,

                            fill: false
                        }
                    ]
                },

                options: {
                    responsive: true,

                    maintainAspectRatio: false,

                    scales: {
                        r: {
                            min: 0,
                            max: 100,

                            ticks: {
                                stepSize: 20,
                                display: false
                            }
                        }
                    },

                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            }
        );
    }

</script>


<script th:inline="javascript">

    const allLabels =
        /*[[${chartLabels}]]*/ [];

    const allStudentScores =
        /*[[${studentScores}]]*/ [];

    const allClassScores =
        /*[[${classScores}]]*/ [];


    const itemsPerPage = 12;


    let totalPages =
        Math.ceil(
            allLabels.length /
            itemsPerPage
        );


    if (totalPages === 0) {
        totalPages = 1;
    }


    let currentPage =
        totalPages;


    let scoreTrendChart =
        null;


    function renderLineChart() {

        const startIdx =
            (currentPage - 1) *
            itemsPerPage;


        const endIdx =
            startIdx +
            itemsPerPage;


        const slicedLabels =
            allLabels.slice(
                startIdx,
                endIdx
            );


        const slicedStudentScores =
            allStudentScores.slice(
                startIdx,
                endIdx
            );


        const slicedClassScores =
            allClassScores.slice(
                startIdx,
                endIdx
            );


        const pageInfo =
            document.getElementById(
                'chartPageInfo'
            );


        const prevButton =
            document.getElementById(
                'btnPrevChart'
            );


        const nextButton =
            document.getElementById(
                'btnNextChart'
            );


        pageInfo.innerText =
            currentPage +
            ' / ' +
            totalPages;


        prevButton.disabled =
            currentPage === 1;


        nextButton.disabled =
            currentPage === totalPages;


        if (scoreTrendChart !== null) {

            scoreTrendChart.destroy();
        }


        const chartCanvas =
            document.getElementById(
                'scoreTrendChart'
            );


        if (!chartCanvas) {
            return;
        }


        const ctxLine =
            chartCanvas.getContext('2d');


        scoreTrendChart =
            new Chart(
                ctxLine,
                {
                    type: 'line',

                    data: {

                        labels:
                        slicedLabels,

                        datasets: [
                            {
                                label:
                                    '학생 점수',

                                data:
                                slicedStudentScores,

                                borderColor:
                                    '#339af0',

                                backgroundColor:
                                    '#339af0',

                                tension: 0.1,

                                pointRadius: 5
                            },

                            {
                                label:
                                    '반 평균',

                                data:
                                slicedClassScores,

                                borderColor:
                                    '#ced4da',

                                backgroundColor:
                                    '#ced4da',

                                tension: 0.1,

                                pointRadius: 5
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        maintainAspectRatio:
                            false,

                        scales: {
                            y: {
                                min: 0,
                                max: 100
                            }
                        },

                        plugins: {
                            legend: {
                                position: 'top',
                                align: 'start'
                            }
                        }
                    }
                }
            );
    }


    renderLineChart();


    document
        .getElementById(
            'btnPrevChart'
        )
        .addEventListener(
            'click',
            function () {

                if (currentPage > 1) {

                    currentPage--;

                    renderLineChart();
                }
            }
        );


    document
        .getElementById(
            'btnNextChart'
        )
        .addEventListener(
            'click',
            function () {

                if (
                    currentPage <
                    totalPages
                ) {

                    currentPage++;

                    renderLineChart();
                }
            }
        );

</script>

</body>
</html>
