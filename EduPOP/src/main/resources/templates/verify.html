<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 학부모 인증</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/parent-verify.css}">
</head>

<body>

<main class="verify-page">

    <section class="verify-container">

        <h1 class="verify-title">
            🔒 학부모 인증
        </h1>

        <p class="verify-description">
            개인정보 보호를 위해
            <strong>최초 1회 인증</strong>이 필요합니다.<br>
            이후에는 이 기기에서 인증 없이 바로 확인할 수 있습니다.
        </p>

        <div th:if="${error}"
             class="error-message"
             th:text="${error}">
        </div>

        <form th:action="@{'/share/reports/' + ${token} + '/verify'}"
              method="post"
              class="verify-form">

            <div class="form-group">

                <label for="studentName"
                       class="input-label">
                    학생 이름
                </label>

                <input type="text"
                       id="studentName"
                       name="studentName"
                       class="input-field"
                       placeholder="학생 이름을 입력하세요"
                       autocomplete="off"
                       required>

            </div>

            <div class="form-group">

                <label for="phoneLast4"
                       class="input-label">
                    전화번호 뒤 4자리
                </label>

                <input type="text"
                       id="phoneLast4"
                       name="phoneLast4"
                       class="input-field"
                       placeholder="예: 1234"
                       maxlength="4"
                       inputmode="numeric"
                       autocomplete="off"
                       required>

            </div>

            <button type="submit"
                    class="btn-submit">
                리포트 확인
            </button>

        </form>

    </section>

</main>

</body>
</html>
