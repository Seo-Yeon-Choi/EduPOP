<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>EduPOP - 학급 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-theme.css}">
</head>
<body class="admin-page admin-classroom-list-page">

<div th:replace="~{layout/header :: header}"></div>
<div th:replace="~{layout/sidebar-admin :: sidebar}"></div>

<div class="toast-container admin-notification-layer position-fixed end-0 p-3">
    <div class="toast admin-toast" id="actionToast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex align-items-center p-3">
            <div style="flex:1;">
                <strong id="toastTitle" style="display:block;font-size:13px;">완료되었습니다</strong>
                <span id="toastMessage" style="display:block;margin-top:3px;color:var(--admin-text-muted);font-size:11px;">
                    성공적으로 처리되었습니다.
                </span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="닫기"></button>
        </div>
    </div>
</div>

<main class="admin-shell">
    <div class="admin-content">
        <header class="admin-page-header">
            <div>
                <span class="admin-eyebrow">Class Management</span>
                <h1>학급 관리</h1>
                <p>학원에 개설된 반의 담당 교사와 운영 상태를 관리합니다.</p>
            </div>
            <a class="ui-button ui-button-primary" th:href="@{/classroom/create}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                학급 생성
            </a>
        </header>

        <section class="admin-filter-bar" aria-label="학급 검색과 상태 필터">
            <label class="admin-search-field" for="classSearchInput">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
                </svg>
                <input class="admin-input" id="classSearchInput" type="search"
                       placeholder="반 이름 또는 담당 교사 검색" oninput="filterClassList(this.value)">
            </label>

            <a class="admin-filter-chip"
               th:classappend="${currentStatus == null or currentStatus == 'ALL'} ? ' active' : ''"
               th:href="@{/classroom/list(status='ALL')}">전체</a>
            <a class="admin-filter-chip"
               th:classappend="${currentStatus == 'ACTIVE'} ? ' active' : ''"
               th:href="@{/classroom/list(status='ACTIVE')}">운영 중</a>
            <a class="admin-filter-chip"
               th:classappend="${currentStatus == 'CLOSED'} ? ' active' : ''"
               th:href="@{/classroom/list(status='CLOSED')}">종강</a>

            <span class="admin-result-count">총 <strong id="visibleClassCount"
                  th:text="${#lists.size(classList)}">0</strong>개 학급</span>
        </section>

        <section class="classroom-bulk-panel" id="classroomBulkPanel" aria-live="polite">
            <label class="classroom-select">
                <input class="admin-checkbox" id="checkAllClass" type="checkbox"
                       onchange="toggleCheckAll(this.checked)">
                보이는 학급 전체 선택
            </label>
            <span><strong id="selectedClassCount">0</strong>개 선택됨</span>
            <button class="ui-button ui-button-secondary ui-button-small" type="button"
                    onclick="handleBulkStatus('ACTIVE')">운영 중 전환</button>
            <button class="ui-button ui-button-danger-outline ui-button-small" type="button"
                    onclick="handleBulkStatus('CLOSED')">종강 처리</button>
        </section>

        <section class="classroom-card-grid" id="classListGrid" aria-label="학급 목록">
            <article class="classroom-card" th:each="cls : ${classList}">
                <div>
                    <div class="classroom-card-top">
                        <div>
                            <h3 class="class-name-cell" th:text="${cls.name}">수학 심화반</h3>
                            <p class="classroom-card-meta">
                                <span th:text="${cls.targetGrade}">중1</span>
                                <span aria-hidden="true"> · </span>
                                정원 <span th:text="${cls.maxStudents}">30</span>명
                            </p>
                        </div>
                        <span th:if="${cls.status != null and cls.status.name() == 'ACTIVE'}"
                              class="admin-status admin-status-active">운영 중</span>
                        <span th:if="${cls.status != null and cls.status.name() == 'CLOSED'}"
                              class="admin-status admin-status-closed">종강</span>
                    </div>

                    <div class="classroom-card-stats">
                        <div class="classroom-card-stat">
                            <strong class="teacher-name-cell"
                                    th:text="${cls.mainTeacherName != null ? cls.mainTeacherName : '미배정'}">미배정</strong>
                            <span>대표 담임</span>
                        </div>
                        <div class="classroom-card-stat">
                            <strong th:text="|${cls.maxStudents}명|">30명</strong>
                            <span>수강 정원</span>
                        </div>
                    </div>
                </div>

                <div class="classroom-card-bottom">
                    <label class="classroom-select">
                        <input class="admin-checkbox class-checkbox" type="checkbox" th:value="${cls.classId}"
                               onchange="updateClassBulkBar()">
                        선택
                    </label>
                    <div class="classroom-card-actions">
                        <a class="ui-button ui-button-secondary ui-button-small"
                           th:href="@{/classroom/{id}(id=${cls.classId})}">상세 관리</a>
                        <button th:if="${cls.status != null and cls.status.name() == 'ACTIVE'}"
                                class="ui-button ui-button-danger-outline ui-button-small" type="button"
                                th:onclick="|handleChangeStatus(${cls.classId}, 'CLOSED')|">종강</button>
                        <button th:if="${cls.status != null and cls.status.name() == 'CLOSED'}"
                                class="ui-button ui-button-secondary ui-button-small" type="button"
                                th:onclick="|handleChangeStatus(${cls.classId}, 'ACTIVE')|">재개</button>
                    </div>
                </div>
            </article>

            <div class="admin-panel admin-empty-state" th:if="${#lists.isEmpty(classList)}"
                 style="grid-column:1/-1;">
                <strong>등록된 학급이 아직 없습니다.</strong>
                <span>첫 번째 학급을 만들어 학원 운영을 시작해보세요.</span>
                <a class="ui-button ui-button-primary" th:href="@{/classroom/create}" style="margin-top:16px;">
                    학급 생성
                </a>
            </div>
            <div class="admin-panel admin-empty-state" id="classNoResults" hidden style="grid-column:1/-1;">
                <strong>검색 결과가 없습니다.</strong>
                <span>반 이름이나 담당 교사명을 다시 확인해주세요.</span>
            </div>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    const ConfirmModal = Swal.mixin({
        customClass: {
            confirmButton: 'ui-button ui-button-primary',
            cancelButton: 'ui-button ui-button-outline'
        },
        buttonsStyling: false
    });

    function showToast(message, isSuccess = true, title = null) {
        const toastElement = document.getElementById('actionToast');
        document.getElementById('toastTitle').textContent = title || (isSuccess ? '완료되었습니다' : '오류가 발생했어요');
        document.getElementById('toastMessage').textContent = message;
        new bootstrap.Toast(toastElement, {delay: 2500}).show();
    }

    function visibleClassCards() {
        return Array.from(document.querySelectorAll('#classListGrid .classroom-card'))
            .filter(card => !card.classList.contains('is-hidden'));
    }

    function filterClassList(keyword) {
        const term = keyword.toLowerCase().trim();
        const cards = Array.from(document.querySelectorAll('#classListGrid .classroom-card'));
        let visible = 0;

        cards.forEach(card => {
            const className = card.querySelector('.class-name-cell')?.textContent.toLowerCase() || '';
            const teacherName = card.querySelector('.teacher-name-cell')?.textContent.toLowerCase() || '';
            const matched = className.includes(term) || teacherName.includes(term);
            card.classList.toggle('is-hidden', !matched);
            if (matched) visible += 1;
        });

        document.getElementById('visibleClassCount').textContent = String(visible);
        document.getElementById('classNoResults').hidden = visible !== 0 || cards.length === 0;
        document.getElementById('checkAllClass').checked = false;
        document.querySelectorAll('.class-checkbox').forEach(checkbox => checkbox.checked = false);
        updateClassBulkBar();
    }

    function toggleCheckAll(checked) {
        visibleClassCards().forEach(card => {
            const checkbox = card.querySelector('.class-checkbox');
            if (checkbox) checkbox.checked = checked;
        });
        updateClassBulkBar();
    }

    function updateClassBulkBar() {
        const count = document.querySelectorAll('.class-checkbox:checked').length;
        document.getElementById('selectedClassCount').textContent = String(count);
        document.getElementById('classroomBulkPanel').classList.toggle('is-visible', count > 0);
    }

    function handleChangeStatus(classId, status) {
        const actionText = status === 'CLOSED' ? '종강' : '운영 재개';

        ConfirmModal.fire({
            title: `반을 ${actionText} 처리하시겠습니까?`,
            text: status === 'CLOSED'
                ? '종강 처리 시 신규 학생 배정이 제한될 수 있습니다.'
                : '반 운영을 다시 시작합니다.',
            icon: status === 'CLOSED' ? 'warning' : 'question',
            showCancelButton: true,
            confirmButtonText: actionText,
            cancelButtonText: '취소'
        }).then(result => {
            if (!result.isConfirmed) return;

            fetch(`/classroom/${classId}/status`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json', [csrfHeader]: csrfToken},
                body: JSON.stringify({status})
            }).then(async response => {
                if (response.ok) {
                    sessionStorage.setItem('pendingToast', `${actionText} 처리가 완료되었습니다.`);
                    window.location.reload();
                } else {
                    showToast((await response.text()) || '상태 변경 중 오류가 발생했습니다.', false);
                }
            });
        });
    }

    function handleBulkStatus(status) {
        const checked = Array.from(document.querySelectorAll('.class-checkbox:checked'));
        if (checked.length === 0) {
            showToast('변경할 학급을 먼저 선택해주세요.', false, '선택 필요');
            return;
        }

        const classIds = checked.map(checkbox => Number(checkbox.value));
        const actionText = status === 'CLOSED' ? '일괄 종강' : '일괄 운영 전환';

        ConfirmModal.fire({
            title: `선택한 ${classIds.length}개 반을 ${actionText}하시겠습니까?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: actionText,
            cancelButtonText: '취소'
        }).then(result => {
            if (!result.isConfirmed) return;

            fetch('/classroom/status/bulk', {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json', [csrfHeader]: csrfToken},
                body: JSON.stringify({classIds, status})
            }).then(async response => {
                if (response.ok) {
                    sessionStorage.setItem('pendingToast', `${classIds.length}개 반의 상태가 변경되었습니다.`);
                    window.location.reload();
                } else {
                    showToast((await response.text()) || '일괄 변경 처리에 실패했습니다.', false);
                }
            });
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const pendingToast = sessionStorage.getItem('pendingToast');
        if (pendingToast) {
            showToast(pendingToast, true);
            sessionStorage.removeItem('pendingToast');
        }
    });
</script>
</body>
</html>
