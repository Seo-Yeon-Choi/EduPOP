<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>EduPOP - 신규 반 개설</title>

  <!-- 공통 CSS -->
  <link rel="stylesheet"
        th:href="@{/css/common.css}">

  <!-- 반 개설 페이지 CSS -->
  <link rel="stylesheet"
        th:href="@{/css/classroom-create.css}">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<!-- =========================================
     공통 헤더
========================================= -->

<div th:replace="~{layout/header :: header}"></div>


<!-- =========================================
     관리자 사이드바
========================================= -->

<div th:replace="~{layout/sidebar-admin :: sidebar}"></div>


<!-- =========================================
     반 개설 본문
========================================= -->

<main class="classroom-create-container">

  <div class="classroom-form-card">

    <!-- 페이지 제목 -->
    <div class="form-header">

      <h2>
        신규 반 개설
      </h2>

      <p>
        학원 내 신규 클래스를 등록하고
        기본 운영 정보를 설정합니다.
      </p>

    </div>


    <!-- =================================
         반 개설 Form
    ================================== -->

    <form th:action="@{/classroom/create}"
          th:object="${request}"
          method="post">

      <!-- 학원 식별자 -->
      <input type="hidden"
             th:field="*{academyId}">

      <span th:if="${#fields.hasErrors('academyId')}"
            th:errors="*{academyId}"
            class="error-message">
            </span>


      <div class="form-grid">

        <!-- =============================
             반 명칭
        ============================== -->

        <div class="form-group full-width">

          <label for="name">
            반 명칭
            <span class="required-star">*</span>
          </label>

          <input type="text"
                 id="name"
                 th:field="*{name}"
                 th:classappend="${#fields.hasErrors('name')} ? 'field-error-input' : ''"
                 class="form-input"
                 placeholder="예: 중등 수학 심화 A반">

          <span th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"
                class="error-message">
                    </span>

        </div>


        <!-- =============================
             대상 학년
        ============================== -->

        <div class="form-group">

          <label for="targetGrade">
            대상 학년
            <span class="required-star">*</span>
          </label>

          <input type="text"
                 id="targetGrade"
                 th:field="*{targetGrade}"
                 th:classappend="${#fields.hasErrors('targetGrade')} ? 'field-error-input' : ''"
                 class="form-input"
                 placeholder="예: 중2, 중3, 고1">

          <span th:if="${#fields.hasErrors('targetGrade')}"
                th:errors="*{targetGrade}"
                class="error-message">
                    </span>

        </div>


        <!-- =============================
             수강 정원
        ============================== -->

        <div class="form-group">

          <label for="maxStudents">
            수강 정원 (명)
            <span class="required-star">*</span>
          </label>

          <input type="number"
                 id="maxStudents"
                 th:field="*{maxStudents}"
                 th:classappend="${#fields.hasErrors('maxStudents')} ? 'field-error-input' : ''"
                 class="form-input"
                 min="1"
                 placeholder="정원 (예: 20)">

          <span th:if="${#fields.hasErrors('maxStudents')}"
                th:errors="*{maxStudents}"
                class="error-message">
                    </span>

        </div>


        <!-- =============================
             반 상세 설명
        ============================== -->

        <div class="form-group full-width">

          <label for="description">
            반 상세 설명
          </label>

          <textarea id="description"
                    th:field="*{description}"
                    class="form-textarea"
                    rows="3"
                    placeholder="수업 목표, 진도 및 커리큘럼 특징을 입력해 주세요."></textarea>

          <span th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}"
                class="error-message">
                    </span>

        </div>


        <!-- =============================
             담당 강사진
        ============================== -->

        <div class="form-group full-width">

          <div class="teacher-title-row">

            <label>
              담당 강사진 배정
              <span class="required-star">*</span>
            </label>

            <button type="button"
                    class="teacher-add-button"
                    onclick="addTeacherRow()">

              <i class="fa-solid fa-plus"></i>
              강사 추가

            </button>

          </div>


          <!-- 강사 목록 -->
          <div id="teacher-list-container"
               class="teacher-section">


            <!-- =========================
                 최초 강사
            ========================== -->

            <div class="teacher-row">

                            <span class="teacher-badge">

                                <i class="fa-solid fa-user-tie"></i>

                                강사

                            </span>


              <!-- 강사 선택 -->
              <select name="teachers[0].teacherId"
                      class="form-select teacher-select-name">

                <option value="1" selected>
                  김수학 강사 (ID: 1)
                </option>

                <option value="2">
                  이영어 강사 (ID: 2)
                </option>

                <option value="3">
                  박과학 강사 (ID: 3)
                </option>

              </select>


              <!-- 담당 역할 -->
              <select name="teachers[0].roleType"
                      class="form-select teacher-select-role">

                <option value="MAIN" selected>
                  대표/담임 (MAIN)
                </option>

                <option value="SUB">
                  부담임/과목 (SUB)
                </option>

              </select>

            </div>

          </div>

        </div>

      </div>


      <!-- =================================
           하단 버튼
      ================================== -->

      <div class="btn-group">

        <a th:href="@{/classroom/list}"
           class="btn btn-cancel">

          취소

        </a>

        <button type="submit"
                class="btn btn-primary">

          개설 완료

        </button>

      </div>

    </form>

  </div>

</main>


<!-- =========================================
     Footer
========================================= -->

<div th:replace="~{layout/footer}"></div>


<!-- =========================================
     강사 추가 JavaScript
========================================= -->

<script>

  let teacherIndex = 1;

  function addTeacherRow() {

    const container =
            document.getElementById('teacher-list-container');

    const newRow =
            document.createElement('div');

    newRow.className = 'teacher-row';

    newRow.innerHTML = `

            <span class="teacher-badge">

                <i class="fa-solid fa-user-tie"></i>

                강사

            </span>


            <select
                name="teachers[${teacherIndex}].teacherId"
                class="form-select teacher-select-name">

                <option value="1">
                    김수학 강사 (ID: 1)
                </option>

                <option value="2" selected>
                    이영어 강사 (ID: 2)
                </option>

                <option value="3">
                    박과학 강사 (ID: 3)
                </option>

            </select>


            <select
                name="teachers[${teacherIndex}].roleType"
                class="form-select teacher-select-role">

                <option value="SUB" selected>
                    부담임/과목 (SUB)
                </option>

                <option value="MAIN">
                    대표/담임 (MAIN)
                </option>

            </select>


            <button
                type="button"
                class="teacher-delete-button"
                onclick="removeTeacherRow(this)">

                삭제

            </button>

        `;

    container.appendChild(newRow);

    teacherIndex++;
  }


  function removeTeacherRow(button) {

    const row =
            button.closest('.teacher-row');

    if (row) {
      row.remove();
    }

  }

</script>

</body>
</html>
