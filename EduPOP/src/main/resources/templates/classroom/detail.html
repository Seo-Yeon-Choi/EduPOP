<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="|EduPOP - ${classroom.name} 상세 관리|">EduPOP - 반 상세 관리</title>
    <!-- 부트스트랩 5 & 아이콘 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SweetAlert2 (위험 액션 Confirm 전용) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- 공통 스타일 -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-classroom-detail.css}">
</head>
<body class="bg-light">

<!-- 공통 상단 헤더 -->
<div th:replace="~{layout/header}"></div>

<!-- 💡 [최신 트렌드] 논블로킹 토스트 알림 컨테이너 (우측 상단) -->
<div class="toast-container position-fixed top-0 end-0 p-3 pt-5 mt-3">
    <div id="actionToast" class="toast align-items-center text-bg-dark border-0 shadow rounded-3" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                <i id="toastIcon" class="bi bi-check-circle-fill text-success fs-5"></i>
                <span id="toastMessage" class="fw-medium">성공적으로 반영되었습니다.</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div class="container-fluid p-0">
    <div class="d-flex">
        <!-- 관리자 사이드바 -->
        <nav class="sidebar">
            <div th:replace="~{layout/sidebar-admin}"></div>
        </nav>

        <!-- 본문 컨텐츠 영역 -->
        <main class="main-content flex-grow-1">
            <!-- 페이지 상단 헤더 -->
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <h2 class="h3 fw-bold mb-0" th:text="${classroom.name}">수학 심화반</h2>
                        <span th:if="${classroom.status != null and classroom.status.name() == 'ACTIVE'}"
                              class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">운영중</span>
                        <span th:if="${classroom.status != null and classroom.status.name() == 'CLOSED'}"
                              class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1">종강</span>
                    </div>
                    <p class="text-muted mb-0">반 기본 정보 수정, 강사진 배정 및 수강생 배정/전반 관리를 수행합니다.</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/classroom/list}" class="btn btn-outline-secondary btn-sm px-3 d-flex align-items-center">
                        <i class="bi bi-arrow-left me-1"></i> 목록으로
                    </a>
                </div>
            </div>

            <!-- 탭 내비게이션 -->
            <ul class="nav nav-tabs mb-4 bg-white px-3 pt-2 rounded-3 border" id="classTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic" type="button" role="tab">
                        <i class="bi bi-sliders me-1"></i> 기본 정보 수정
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="teacher-tab" data-bs-toggle="tab" data-bs-target="#teacher" type="button" role="tab">
                        <i class="bi bi-person-badge me-1"></i> 강사 배정 관리
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="student-tab" data-bs-toggle="tab" data-bs-target="#student" type="button" role="tab">
                        <i class="bi bi-people me-1"></i> 수강생 배정 / 전반 관리
                    </button>
                </li>
            </ul>

            <!-- 탭 컨텐츠 영역 -->
            <div class="tab-content" id="classTabContent">

                <!-- 💡 [탭 1] 기본 정보 수정 -->
                <div class="tab-pane fade show active" id="basic" role="tabpanel">
                    <div class="card shadow-sm border-0 bg-white">
                        <div class="card-body p-4">
                            <form id="basicInfoForm" onsubmit="handleUpdateBasic(event)">
                                <input type="hidden" id="classId" th:value="${classroom.classId}">

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">반 명칭 <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="className" th:value="${classroom.name}" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold">대상 학년 <span class="text-danger">*</span></label>
                                        <select class="form-select" id="targetGrade">
                                            <option value="초등" th:selected="${classroom.targetGrade == '초등'}">초등</option>
                                            <option value="중1" th:selected="${classroom.targetGrade == '중1'}">중1</option>
                                            <option value="중2" th:selected="${classroom.targetGrade == '중2'}">중2</option>
                                            <option value="중3" th:selected="${classroom.targetGrade == '중3'}">중3</option>
                                            <option value="고1" th:selected="${classroom.targetGrade == '고1'}">고1</option>
                                            <option value="고2" th:selected="${classroom.targetGrade == '고2'}">고2</option>
                                            <option value="고3" th:selected="${classroom.targetGrade == '고3'}">고3</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold">수강 정원 (명) <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" id="maxStudents" th:value="${classroom.maxStudents}" min="1" max="100" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">운영 상태</label>
                                        <select class="form-select" id="classStatus">
                                            <option value="ACTIVE" th:selected="${classroom.status != null and classroom.status.name() == 'ACTIVE'}">운영중 (ACTIVE)</option>
                                            <option value="CLOSED" th:selected="${classroom.status != null and classroom.status.name() == 'CLOSED'}">종강 (CLOSED)</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-bold">반 설명 및 메모</label>
                                        <textarea class="form-control" id="description" rows="4" th:text="${classroom.description}"></textarea>
                                    </div>
                                </div>

                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-check-lg me-1"></i> 기본 정보 저장
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- 💡 [탭 2] 강사 배정 관리 -->
                <div class="tab-pane fade" id="teacher" role="tabpanel">
                    <div class="card shadow-sm border-0 bg-white">
                        <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                            <h5 class="card-title fw-bold mb-0">배정된 강사진</h5>
                            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#assignTeacherModal">
                                <i class="bi bi-plus-circle me-1"></i> 강사 추가 배정
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-hover mb-0 text-center">
                                <thead class="table-light">
                                <tr>
                                    <th>강사 ID</th>
                                    <th>강사명</th>
                                    <th>역할 구분</th>
                                    <th>관리</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(classroom.teachers)}">
                                    <td colspan="4" class="py-4 text-muted">현재 배정된 강사가 없습니다.</td>
                                </tr>
                                <tr th:each="teacher : ${classroom.teachers}">
                                    <td th:text="${teacher.teacherId}">1</td>
                                    <td class="fw-bold" th:text="${teacher.name}">홍길동</td>
                                    <td>
                                        <span th:if="${teacher.roleType == 'MAIN'}" class="badge bg-danger-subtle text-danger border px-2 py-1">
                                            <i class="bi bi-star-fill me-1"></i>대표 담임
                                        </span>
                                        <span th:if="${teacher.roleType == 'SUB'}" class="badge bg-info-subtle text-info border px-2 py-1">부담임</span>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-danger" th:onclick="|handleRemoveTeacher(this, ${teacher.teacherId})|">
                                            배정 해제
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 💡 [탭 3] 체크박스 기반 수강생 배정 / 전반 관리 -->
                <div class="tab-pane fade" id="student" role="tabpanel">
                    <div class="card shadow-sm border-0 bg-white p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h5 class="fw-bold mb-1">수강생 배정 / 전반 관리</h5>
                                <p class="text-muted small mb-0">학생 체크박스를 선택한 후 [배정] 또는 [제외] 버튼을 눌러 이동하세요.</p>
                            </div>
                            <span class="badge bg-primary fs-6 px-3 py-2">
                                현재 수강 인원: <span id="currentCount" th:text="${#lists.size(classroom.students)}">0</span> / <span id="maxCapacityText" th:text="${classroom.maxStudents}">30</span>명
                            </span>
                        </div>

                        <!-- 체크박스 리스트 레이아웃 -->
                        <div class="row align-items-center g-3">
                            <!-- 좌측: 학원 전체 학생 풀 -->
                            <div class="col-md-5">
                                <div class="card border rounded-3 overflow-hidden">
                                    <div class="card-header bg-light py-2 d-flex justify-content-between align-items-center">
                                        <div class="form-check mb-0">
                                            <input class="form-check-input" type="checkbox" id="checkAllLeft" onchange="toggleCheckAll('leftList', this.checked)">
                                            <label class="form-check-label fw-semibold" for="checkAllLeft">전체 학생 풀</label>
                                        </div>
                                        <input type="text" class="form-control form-control-sm w-50" placeholder="이름 검색..." onkeyup="filterCheckList('leftList', this.value)">
                                    </div>
                                    <div class="list-group list-group-flush student-check-list" id="leftList">
                                        <label class="list-group-item student-item d-flex align-items-center gap-2 py-2"
                                               th:each="std : ${studentPool}"
                                               th:attr="data-student-id=${std.studentId}, data-current-class=${std.currentClassName != null ? std.currentClassName : 'NONE'}, data-display-label=${std.displayLabel}">
                                            <input class="form-check-input flex-shrink-0" type="checkbox" th:value="${std.studentId}">
                                            <span class="small" th:text="${std.displayLabel}">[중1] 김민수 (0001 | 미배정)</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- 중앙: 이동 버튼부 -->
                            <div class="col-md-2 d-flex flex-column align-items-center justify-content-center gap-2">
                                <button type="button" class="btn btn-outline-primary btn-sm w-75 fw-bold py-1 shadow-sm" onclick="moveToRight()" title="선택 배정">
                                    배정 <i class="bi bi-chevron-right"></i>
                                </button>
                                <button type="button" class="btn btn-primary btn-sm w-75 fw-bold py-1 shadow-sm" onclick="moveAllToRight()" title="전체 배정">
                                    전체 <i class="bi bi-chevron-double-right"></i>
                                </button>

                                <hr class="w-75 my-1 text-muted">

                                <button type="button" class="btn btn-outline-danger btn-sm w-75 fw-bold py-1 shadow-sm" onclick="moveToLeft()" title="선택 제외">
                                    <i class="bi bi-chevron-left"></i> 제외
                                </button>
                                <button type="button" class="btn btn-danger btn-sm w-75 fw-bold py-1 shadow-sm" onclick="moveAllToLeft()" title="전체 제외">
                                    <i class="bi bi-chevron-double-left"></i> 전체
                                </button>
                            </div>

                            <!-- 우측: 현재 반 배정 명단 -->
                            <div class="col-md-5">
                                <div class="card border rounded-3 overflow-hidden">
                                    <div class="card-header bg-light py-2 d-flex justify-content-between align-items-center">
                                        <div class="form-check mb-0">
                                            <input class="form-check-input" type="checkbox" id="checkAllRight" onchange="toggleCheckAll('rightList', this.checked)">
                                            <label class="form-check-label fw-semibold text-primary" for="checkAllRight">현재 반 배정 명단</label>
                                        </div>
                                        <input type="text" class="form-control form-control-sm w-50" placeholder="이름 검색..." onkeyup="filterCheckList('rightList', this.value)">
                                    </div>
                                    <div class="list-group list-group-flush student-check-list" id="rightList">
                                        <label class="list-group-item student-item d-flex align-items-center gap-2 py-2"
                                               th:each="std : ${classroom.students}"
                                               th:attr="data-student-id=${std.studentId}, data-current-class=${classroom.name}, data-display-label=${std.displayLabel}">
                                            <input class="form-check-input flex-shrink-0" type="checkbox" th:value="${std.studentId}">

                                            <!-- 💡 [수정] std.name 대신 std.displayLabel 로 출력 -->
                                            <span class="small fw-semibold" th:text="${std.displayLabel}">[중3] 고유나 (0024)</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 최종 저장 버튼 -->
                        <div class="text-end mt-4">
                            <button type="button" class="btn btn-primary px-4 shadow-sm" onclick="saveClassroomStudents()">
                                <i class="bi bi-save me-1"></i> 수강생 배정 상태 최종 저장
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- 💡 강사 추가 배정 모달 -->
<div class="modal fade" id="assignTeacherModal" tabindex="-1" aria-labelledby="assignTeacherModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold" id="assignTeacherModalLabel">
                    <i class="bi bi-person-plus text-primary me-2"></i>강사 추가 배정
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="assignTeacherForm" onsubmit="submitTeacherAssign(event)">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">담당 강사 선택 <span class="text-danger">*</span></label>
                        <select class="form-select" id="modalTeacherId" required>
                            <option value="" selected disabled>강사를 선택해 주세요</option>
                            <option th:each="teacher : ${teacherList}"
                                    th:value="${teacher.teacherId}"
                                    th:text="${teacher.name}">
                                홍길동
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">역할 구분 <span class="text-danger">*</span></label>
                        <select class="form-select" id="modalRoleType">
                            <option value="SUB">부담임 (SUB)</option>
                            <option value="MAIN">대표 담임 (MAIN)</option>
                        </select>
                    </div>

                    <div class="modal-footer border-top px-0 pb-0 mt-4">
                        <button type="button" class="btn btn-light btn-sm px-3 border rounded-2" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary btn-sm px-3 rounded-2">배정하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 공통 푸터 -->
<div th:replace="~{layout/footer}"></div>

<!-- 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    // 💡 [트렌드 UX] 비차단 토스트 알림 헬퍼 함수
    function showToast(message, isSuccess = true) {
        const toastEl = document.getElementById('actionToast');
        const toastMsg = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');

        toastMsg.innerText = message;
        if (isSuccess) {
            toastIcon.className = 'bi bi-check-circle-fill text-success fs-5';
        } else {
            toastIcon.className = 'bi bi-exclamation-triangle-fill text-danger fs-5';
        }

        const toast = new bootstrap.Toast(toastEl, { delay: 2000 });
        toast.show();
    }

    // 💡 위험 작업 확인용 미니멀 Confirm 모달 헬퍼
    const ConfirmModal = Swal.mixin({
        customClass: {
            popup: 'rounded-4 shadow-lg border-0 p-4',
            confirmButton: 'btn btn-primary px-4 py-2 rounded-3 fw-bold mx-1',
            cancelButton: 'btn btn-light border px-4 py-2 rounded-3 fw-bold mx-1'
        },
        buttonsStyling: false
    });

    // 💡 페이지 로드 시 탭 복원 및 전달된 세션 토스트 처리
    window.addEventListener('DOMContentLoaded', () => {
        const activeTabId = sessionStorage.getItem('activeTab');
        if (activeTabId) {
            const triggerEl = document.getElementById(activeTabId);
            if (triggerEl) {
                bootstrap.Tab.getOrCreateInstance(triggerEl).show();
            }
            sessionStorage.removeItem('activeTab');
        }

        const pendingToast = sessionStorage.getItem('pendingToast');
        if (pendingToast) {
            showToast(pendingToast, true);
            sessionStorage.removeItem('pendingToast');
        }
    });

    // 💡 1. 반 기본 정보 수정
    function handleUpdateBasic(event) {
        event.preventDefault();
        const classId = document.getElementById('classId').value;

        const updateData = {
            name: document.getElementById('className').value,
            targetGrade: document.getElementById('targetGrade').value,
            maxStudents: Number(document.getElementById('maxStudents').value),
            status: document.getElementById('classStatus').value,
            description: document.getElementById('description').value
        };

        fetch(`/classroom/${classId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify(updateData)
        })
            .then(async response => {
                if (response.ok) {
                    sessionStorage.setItem('activeTab', 'basic-tab');
                    sessionStorage.setItem('pendingToast', '반 정보가 수정되었습니다.');
                    location.reload();
                } else {
                    const errorMsg = await response.text();
                    showToast(errorMsg || '반 정보 수정 실패', false);
                }
            });
    }

    // 💡 2. 강사 추가 배정
    function submitTeacherAssign(event) {
        event.preventDefault();
        const classId = document.getElementById('classId').value;
        const teacherId = document.getElementById('modalTeacherId').value;
        const roleType = document.getElementById('modalRoleType').value;

        fetch(`/classroom/${classId}/teachers`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify({ teacherId: Number(teacherId), roleType: roleType })
        })
            .then(async response => {
                if (response.ok) {
                    sessionStorage.setItem('activeTab', 'teacher-tab');
                    sessionStorage.setItem('pendingToast', '강사가 배정되었습니다.');
                    location.reload();
                } else {
                    const errorMsg = await response.text();
                    showToast(errorMsg || '강사 배정 실패', false);
                }
            });
    }

    // 💡 3. 강사 배정 해제 (미니멀 Confirm)
    function handleRemoveTeacher(buttonEl, teacherId) {
        const classId = document.getElementById('classId').value;
        ConfirmModal.fire({
            title: '강사 배정을 해제하시겠습니까?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '해제',
            cancelButtonText: '취소'
        }).then((result) => {
            if (result.isConfirmed) {
                fetch(`/classroom/${classId}/teachers/${teacherId}`, {
                    method: 'DELETE',
                    headers: { [csrfHeader]: csrfToken }
                })
                    .then(res => {
                        if (res.ok) {
                            buttonEl.closest('tr').remove();
                            showToast('강사 배정이 해제되었습니다.');
                        }
                    });
            }
        });
    }

    // 💡 4. 체크박스 전체 선택 토글
    function toggleCheckAll(containerId, isChecked) {

        const container =
            document.getElementById(containerId);

        const checkboxes =
            container.querySelectorAll(
                '.student-item:not(.is-hidden) input[type="checkbox"]'
            );

        checkboxes.forEach(
            checkbox =>
                checkbox.checked = isChecked
        );
    }

    // 💡 5. 선택 학생 오른쪽 배정 (>) - 전반 컨펌 모달 연동
    async function moveToRight() {
        const leftList = document.getElementById('leftList');
        const rightList = document.getElementById('rightList');
        const maxCapacity = Number(document.getElementById('maxCapacityText').innerText);
        const thisClassName = document.getElementById('className').value.trim(); // 현재 반 이름

        const checkedBoxes = Array.from(leftList.querySelectorAll('input[type="checkbox"]:checked'));
        if (checkedBoxes.length === 0) {
            showToast('배정할 학생을 선택해 주세요.', false);
            return;
        }

        const currentRightCount = rightList.querySelectorAll('.student-item').length;
        if (currentRightCount + checkedBoxes.length > maxCapacity) {
            showToast(`수강 정원(${maxCapacity}명)을 초과할 수 없습니다.`, false);
            return;
        }

        for (const cb of checkedBoxes) {
            const item = cb.closest('.student-item');
            const studentId = item.getAttribute('data-student-id');
            const currentClass = (item.getAttribute('data-current-class') || '').trim();
            const displayLabel = item.getAttribute('data-display-label');

            // 💡 이미 우측 명단에 존재하는 학생이면 중복 추가 방지
            const alreadyExists = rightList.querySelector(`.student-item[data-student-id="${studentId}"]`);
            if (alreadyExists) {
                item.remove(); // 왼쪽 중복 아이템 제거
                continue;
            }

            // 💡 [핵심] 'NONE', 빈값, null, 그리고 '현재 반 명칭'이 아닐 때만 전반 팝업 띄움
            if (currentClass && currentClass !== 'NONE' && currentClass !== 'null' && currentClass !== thisClassName) {
                const result = await ConfirmModal.fire({
                    title: '전반(반 이동) 안내',
                    html: `<b>${displayLabel}</b> 학생은 현재 <b>[${currentClass}]</b>에 배정되어 있습니다.<br>현재 반으로 전반 처리하시겠습니까?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: '전반 진행',
                    cancelButtonText: '취소'
                });

                if (!result.isConfirmed) continue;
            }

            cb.checked = false;
            item.classList.remove('is-hidden');
            rightList.appendChild(item); // 💡 왼쪽에서 오른쪽으로 '이동(Move)' (복제가 아님)
        }

        document.getElementById('checkAllLeft').checked = false;
        updateCapacityBadge();
    }

    // 💡 6. 전체 학생 오른쪽 일괄 배정 (>>)
    async function moveAllToRight() {
        const leftList = document.getElementById('leftList');
        const rightList = document.getElementById('rightList');
        const maxCapacity = Number(document.getElementById('maxCapacityText').innerText);
        const thisClassName = document.getElementById('className').value.trim();

        const visibleItems = Array.from(
            leftList.querySelectorAll(
                '.student-item:not(.is-hidden)'
            )
        );
        if (visibleItems.length === 0) {
            showToast('이동할 수 있는 학생이 없습니다.', false);
            return;
        }

        const currentRightCount = rightList.querySelectorAll('.student-item').length;
        if (currentRightCount + visibleItems.length > maxCapacity) {
            showToast(`정원(${maxCapacity}명)을 초과합니다.`, false);
            return;
        }

        // 타 반 소속 학생만 정확히 필터링
        const transferStudents = visibleItems.filter(item => {
            const cls = (item.getAttribute('data-current-class') || '').trim();
            return cls && cls !== 'NONE' && cls !== 'null' && cls !== thisClassName;
        });

        if (transferStudents.length > 0) {
            const result = await ConfirmModal.fire({
                title: '일괄 전반 확인',
                html: `이동 대상 중 타 반 소속 학생이 <b>${transferStudents.length}명</b> 포함되어 있습니다.<br>모두 현재 반으로 전반 처리하시겠습니까?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: '전체 전반 진행',
                cancelButtonText: '취소'
            });

            if (!result.isConfirmed) return;
        }

        visibleItems.forEach(item => {
            const studentId = item.getAttribute('data-student-id');
            const alreadyExists = rightList.querySelector(`.student-item[data-student-id="${studentId}"]`);

            if (alreadyExists) {
                item.remove();
            } else {
                item.querySelector('input[type="checkbox"]').checked = false;
                rightList.appendChild(item);
            }
        });

        document.getElementById('checkAllLeft').checked = false;
        updateCapacityBadge();
    }

    // 💡 7. 선택 학생 왼쪽 제외 (<)
    function moveToLeft() {
        const leftList = document.getElementById('leftList');
        const rightList = document.getElementById('rightList');

        const checkedBoxes = Array.from(rightList.querySelectorAll('input[type="checkbox"]:checked'));
        if (checkedBoxes.length === 0) {
            showToast('제외할 학생을 선택해 주세요.', false);
            return;
        }

        checkedBoxes.forEach(cb => {
            const item = cb.closest('.student-item');
            cb.checked = false;
            item.classList.remove('is-hidden');
            leftList.appendChild(item);
        });

        document.getElementById('checkAllRight').checked = false;
        updateCapacityBadge();
    }

    // 💡 8. 전체 학생 왼쪽 일괄 제외 (<<)
    function moveAllToLeft() {
        const leftList = document.getElementById('leftList');
        const rightList = document.getElementById('rightList');

        const visibleItems = Array.from(rightList.querySelectorAll('.student-item:not([style*="display: none"])'));
        if (visibleItems.length === 0) {
            showToast('제외할 학생이 없습니다.', false);
            return;
        }

        visibleItems.forEach(item => {
            item.querySelector('input[type="checkbox"]').checked = false;
            item.classList.remove(
                'is-hidden'
            );
            leftList.appendChild(item);
        });

        document.getElementById('checkAllRight').checked = false;
        updateCapacityBadge();
    }

    // 💡 9. 정원 뱃지 실시간 숫자 동기화
    function updateCapacityBadge() {
        const rightList = document.getElementById('rightList');
        const count = rightList.querySelectorAll('.student-item').length;
        document.getElementById('currentCount').innerText = count;
    }

    // 💡 10. 체크박스 리스트 검색 필터
    function filterCheckList(containerId, keyword) {

        const container =
            document.getElementById(containerId);

        const term =
            keyword.toLowerCase();

        const items =
            container.querySelectorAll('.student-item');

        items.forEach(item => {

            const text =
                item.innerText.toLowerCase();

            item.classList.toggle(
                'is-hidden',
                !text.includes(term)
            );
        });
    }

    // 💡 11. 최종 수강생 배정 상태 일괄 저장 API 호출 (토스트 피드백)
    function saveClassroomStudents() {
        const classId = document.getElementById('classId').value;
        const rightList = document.getElementById('rightList');

        const studentItems = Array.from(rightList.querySelectorAll('.student-item'));
        const studentIds = studentItems.map(item => Number(item.getAttribute('data-student-id')));

        fetch(`/classroom/${classId}/students/sync`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify({ studentIds: studentIds })
        })
            .then(res => {
                if (res.ok) {
                    sessionStorage.setItem('activeTab', 'student-tab');
                    sessionStorage.setItem('pendingToast', '수강생 배정이 성공적으로 저장되었습니다.');
                    location.reload();
                } else {
                    showToast('수강생 배정 저장 중 오류가 발생했습니다.', false);
                }
            });
    }
</script>
</body>
</html>
