<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!--
    학부모 Sidebar

    사용 방법
    <div th:replace="~{layout/sidebar-parent :: sidebar}"></div>
-->
<aside th:fragment="sidebar" class="sidebar">

    <div class="sidebar-title">
        학부모
    </div>

    <nav class="sidebar-nav">

        <!-- 홈 -->
        <a th:href="@{/parent}"
           class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>홈</span>
        </a>

        <!-- 자녀 리포트 -->
        <a th:href="@{/parent/reports}"
           class="nav-item">
            <span class="nav-icon">▧</span>
            <span>자녀 리포트</span>
        </a>

    </nav>

</aside>

</body>
</html>
