<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="top-header">
    <div class="header-logo">
        <th:block th:if="${session.loginUser != null}"
                  th:switch="${session.loginUser.role.toString()}">
            <a th:case="'STUDENT'"
               th:href="@{/main/studentMain}"
               class="logo-link"
               aria-label="EduPOP 학생 홈">
                EduPOP
            </a>
            <a th:case="'TEACHER'"
               th:href="@{/main/teacherMain}"
               class="logo-link"
               aria-label="EduPOP 선생님 홈">
                EduPOP
            </a>
            <a th:case="'ADMIN'"
               th:href="@{/main/adminMain}"
               class="logo-link"
               aria-label="EduPOP 관리자 홈">
                EduPOP
            </a>
        </th:block>

        <a th:if="${session.loginUser == null}"
           th:href="@{/}"
           class="logo-link"
           aria-label="EduPOP 시작 페이지">
            EduPOP
        </a>
    </div>
</header>

</body>
</html>
