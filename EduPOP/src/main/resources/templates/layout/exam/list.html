<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPOP - 시험지 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/exam-list.css}">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>
<div th:replace="~{layout/sidebar-teacher :: sidebar}"></div>

<main class="exam-list-container">
    <div class="exam-list-header">
        <div>
            <h1>시험지 목록</h1>
            <p>시험명을 누르면 등록한 문제와 시험 정보를 확인할 수 있습니다.</p>
        </div>

        <a th:href="@{/teacher/exams/create}" class="create-exam-button">+ 시험지 만들기</a>
    </div>

    <div class="empty-exam" th:if="${#lists.isEmpty(exams)}">등록된 시험지가 없습니다.</div>

    <div class="exam-table-wrapper" th:unless="${#lists.isEmpty(exams)}">
        <table class="exam-table">
            <thead>
            <tr>
                <th>번호</th>
                <th>시험명</th>
                <th>시험 유형</th>
                <th>시험 방식</th>
                <th>시험일</th>
                <th>상태</th>
                <th>등록일</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="exam : ${exams}">
                <td th:text="${exam.examId}">1</td>
                <td class="exam-title">
                    <a class="exam-title-link"
                       th:href="@{/teacher/exams/{examId}(examId=${exam.examId})}"
                       th:text="${exam.title}">8월 월말 평가</a>
                </td>
                <td th:text="${exam.examType}">MONTHLY</td>
                <td th:text="${exam.examMode}">PAPER</td>
                <td th:text="${exam.examDate != null ? exam.examDate : '-'}">2026-08-31</td>
                <td><span class="status-badge" th:text="${exam.status}">DRAFT</span></td>
                <td th:text="${exam.createdAt != null ? #temporals.format(exam.createdAt, 'yyyy-MM-dd') : '-'}">2026-08-20</td>
                <td>
                    <a class="edit-exam-link"
                       th:href="@{/teacher/exams/{examId}/edit(examId=${exam.examId})}">수정</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
