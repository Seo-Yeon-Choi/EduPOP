<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPOP - 시험지 목록</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/exam-list.css}">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{layout/header :: header}"></div>

<!-- SIDEBAR -->
<div th:replace="~{layout/sidebar-teacher :: sidebar}"></div>

<!-- MAIN -->
<main class="exam-list-container">

    <!-- 상단 제목 / 시험지 생성 버튼 -->
    <div class="exam-list-header">
        <div>
            <h1>시험지 목록</h1>
            <p>등록된 시험지를 확인하고 관리할 수 있습니다.</p>
        </div>

        <a th:href="@{/teacher/exams/create}" class="create-exam-button">+ 시험지 만들기</a>
    </div>

    <!-- 시험이 하나도 없는 경우 -->
    <div class="empty-exam" th:if="${#lists.isEmpty(exams)}">등록된 시험지가 없습니다.</div>

    <!-- 시험 목록 -->
    <div class="exam-table-wrapper" th:unless="${#lists.isEmpty(exams)}">
        <table class="exam-table">
            <thead>
            <tr>
                <th>번호</th>
                <th>시험명</th>
                <th>시험 유형</th>
                <th>시험 방식</th>
                <th>시험일</th>
                <th>상태</th>
                <th>등록일</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="exam : ${exams}">
                <td th:text="${exam.examId}">1</td>

                <td class="exam-title">
                    <span th:text="${exam.title}">8월 월말 평가</span>
                </td>

                <td th:text="${exam.examType}">MONTHLY</td>

                <td th:text="${exam.examMode}">PAPER</td>

                <td th:text="${exam.examDate}">2026-08-31</td>

                <td>
                    <span class="status-badge" th:text="${exam.status}">
                        DRAFT
                    </span>
                </td>

                <td th:text="${#temporals.format(exam.createdAt, 'yyyy-MM-dd')}">
                    2026-08-20
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
