spring.application.name=EduPOP-test

spring.datasource.url=jdbc:h2:mem:edupop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.EduPOP.domain
mybatis.configuration.map-underscore-to-camel-case=true

kakao.client-id=test-kakao-client
kakao.redirect-uri=http://localhost/kakao/callback
naver.client-id=test-naver-client
naver.client-secret=test-naver-secret
naver.redirect-uri=http://localhost/naver/callback
google.client-id=test-google-client
google.client-secret=test-google-secret
google.redirect-uri=http://localhost/google/callback
nts.business-api-key=test-nts-key

jwt.secret=ThisIsATestSecretKeyLongEnoughForHS256Algorithm
jwt.expiration=86400000

spring.thymeleaf.cache=false
