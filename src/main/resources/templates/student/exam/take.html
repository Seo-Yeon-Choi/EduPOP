<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${exam.title}">시험 응시</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/student-exam-take.css}">
    <link rel="stylesheet" th:href="@{/css/student-theme.css}">
</head>

<body class="student-focus-page">
<main class="exam-take-container">
    <header class="exam-header">
        <div class="exam-header-title">
            <span class="exam-mode-chip" th:text="${mode == 'REVIEW'} ? '오답 복습' : '시험 응시'">시험 응시</span>
            <div>
                <h1 th:text="${exam.title}">시험 제목</h1>
                <p th:if="${mode == 'REVIEW'}">이전에 틀렸던 문제를 천천히 다시 풀어보세요.</p>
                <p th:if="${exam.examType == 'WORD'}">제한 시간은 15분이에요. 아는 문제부터 차근차근 풀어봐요!</p>
            </div>
        </div>

        <div class="exam-header-status">
            <span class="question-total">총 <b th:text="${#lists.size(questions)}">0</b>문제</span>
            <div th:if="${exam.examType == 'WORD'}" id="examTimer" class="exam-timer">
                <span class="timer-label">⏱ 남은 시간</span>
                <strong id="timerDisplay">15:00</strong>
            </div>
            <div class="exam-mini-character">
                <span>할 수 있어!</span>
                <img th:src="@{/images/exp/character.png}" alt="시험을 응원하는 팝이">
            </div>
        </div>
    </header>

    <input type="hidden" id="attemptId" th:value="${attempt.attemptId}">
    <input type="hidden" id="wordExam" th:value="${exam.examType == 'WORD'}">

    <div class="exam-workspace">
        <aside class="question-navigation" aria-label="문제 바로가기">
            <strong>문제 이동</strong>
            <div>
                <a th:each="question, stat : ${questions}"
                   th:href="|#question-${stat.count}|"
                   th:text="${stat.count}">1</a>
            </div>
            <p>답을 선택하면 번호 색상이 바뀌어요.</p>
        </aside>

        <section class="question-list">
            <article class="question-card"
                     th:each="question, questionStat : ${questions}"
                     th:id="|question-${questionStat.count}|"
                     th:data-question-id="${question.questionId}">
                <div class="question-number">
                    <span>QUESTION</span>
                    <strong th:text="${questionStat.count}">1</strong>
                    <small th:text="|/ ${questionStat.size}|">/ 10</small>
                </div>

                <div th:if="${question.passage != null and !question.passage.isEmpty()}"
                     class="question-passage"
                     th:text="${question.passage}">지문</div>

                <h2 class="question-text" th:text="${question.questionText}">문제 내용</h2>

                <div th:if="${question.questionType == 'MULTIPLE_CHOICE'}" class="choice-list">
                    <label th:each="choice : ${question.choices}" class="choice-item">
                        <input type="radio"
                               th:name="'question-' + ${question.questionId}"
                               th:value="${choice.choiceNumber}">
                        <span class="choice-number" th:text="${choice.choiceNumber}">1</span>
                        <span class="choice-text" th:text="${choice.choiceText}">선지</span>
                    </label>
                </div>

                <div th:if="${question.questionType == 'SHORT_ANSWER'}" class="short-answer">
                    <label th:for="|answer-${question.questionId}|">내 답을 입력해 주세요</label>
                    <input th:id="|answer-${question.questionId}|"
                           type="text"
                           class="student-answer"
                           th:name="'question-' + ${question.questionId}"
                           placeholder="정답을 입력하세요">
                </div>
            </article>
        </section>
    </div>

    <div class="submit-area">
        <div><span>✓</span> 답안을 모두 확인했나요?</div>
        <button type="button" id="submitExamButton">시험 제출하기 →</button>
    </div>
</main>

<script th:src="@{/js/student-exam.js}"></script>
<script>
    document.addEventListener("change", function (event) {
        const card = event.target.closest(".question-card");
        if (!card) return;
        const number = card.id.replace("question-", "");
        const nav = document.querySelector('.question-navigation a[href="#question-' + number + '"]');
        if (nav) nav.classList.add("answered");
    });
</script>
</body>
</html>
